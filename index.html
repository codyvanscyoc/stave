<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stave</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1c1c1e;
      --bg2:      #252528;
      --bg3:      #2e2e32;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.13);
      --text:     #f0e8d8;
      --text2:    #9a9080;
      --text3:    #4e4a44;
      --accent:   #c8922a;
      --accent2:  #a07420;
      --accentbg: rgba(200,146,42,0.10);
      --teal:     #4caf7d;
      --tealbg:   rgba(76,175,125,0.10);
      --teal2:    #2e8a57;
      --success:  #4caf7d;
      --danger:   #c0392b;
    }

    html, body {
      width: 100%; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px; -webkit-font-smoothing: antialiased;
      user-select: none; display: flex; flex-direction: column;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── TOPBAR ── */
    #topbar {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 13px; border-bottom: 0.5px solid var(--border);
      -webkit-app-region: drag; flex-shrink: 0;
    }

    #app-name {
      font-size: 12px; font-weight: 500; letter-spacing: 0.1em;
      color: var(--accent); flex-shrink: 0; flex: 1;
    }

    .topbar-right {
      display: flex; align-items: center; gap: 6px;
      -webkit-app-region: no-drag; flex-shrink: 0;
    }

    .topbar-icon-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px; padding: 0;
      border-radius: 5px; border: 0.5px solid var(--border2);
      color: var(--text2); background: transparent;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s;
      outline: none; display: flex; align-items: center;
      justify-content: center; width: 30px; height: 26px;
    }

    .topbar-icon-btn:hover { color: var(--accent); border-color: var(--accent2); }
    .topbar-icon-btn img { display: block; width: 14px; height: 14px; opacity: 0.65; transition: opacity 0.15s; }
    .topbar-icon-btn:hover img { opacity: 1; }

    .mode-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.05em; padding: 4px 11px;
      background: transparent; color: var(--text2);
      border: none; cursor: pointer; transition: all 0.15s; outline: none;
    }

    #mode-toggle {
      display: flex; border: 0.5px solid var(--border); border-radius: 5px; overflow: hidden;
    }

    .mode-btn.active { background: var(--accent); color: #1c1c1e; font-weight: 500; }
    .mode-btn:hover:not(.active) { color: var(--text); background: var(--bg2); }

    /* ── TAB BAR ── */
    #tab-bar {
      display: flex; align-items: center;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg); flex-shrink: 0;
      overflow-x: auto; overflow-y: hidden;
      -webkit-app-region: no-drag;
      min-height: 34px;
    }

    #tab-bar::-webkit-scrollbar { height: 2px; }
    #tab-bar::-webkit-scrollbar-thumb { background: var(--border2); }

    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px; height: 34px; flex-shrink: 0;
      border-right: 0.5px solid var(--border);
      cursor: pointer; transition: background 0.12s;
      max-width: 160px; min-width: 80px;
      position: relative;
    }

    .tab:hover { background: var(--bg2); }
    .tab.active { background: var(--bg2); }

    .tab-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }

    .tab-title {
      font-size: 10px; color: var(--text2); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; flex: 1;
      letter-spacing: 0.03em;
    }

    .tab.active .tab-title { color: var(--text); }

    .tab-close {
      font-size: 12px; color: var(--text3); cursor: pointer;
      flex-shrink: 0; line-height: 1; padding: 1px 2px;
      border-radius: 3px; transition: all 0.12s;
    }

    .tab-close:hover { color: var(--danger); background: rgba(192,57,43,0.1); }

    #tab-add {
      font-size: 16px; color: var(--text3); background: transparent;
      border: none; cursor: pointer; padding: 0 12px; height: 34px;
      flex-shrink: 0; outline: none; transition: color 0.15s;
      font-family: 'JetBrains Mono', monospace; line-height: 1;
    }

    #tab-add:hover { color: var(--accent); }

    /* ── NOTE META ── */
    #note-meta-bar {
      padding: 5px 13px; border-bottom: 0.5px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    }

    #note-title {
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      font-weight: 500; color: var(--text); background: transparent;
      border: none; outline: none; flex: 1;
      -webkit-user-select: text; user-select: text;
    }

    #note-title::placeholder { color: var(--text3); }
    #note-meta { font-size: 10px; color: var(--text3); letter-spacing: 0.03em; flex-shrink: 0; }

    /* ── PANELS ── */
    #panel-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
    .panel.active { display: flex; }

    .field-label {
      font-size: 9px; font-weight: 500; letter-spacing: 0.14em;
      color: var(--text3); text-transform: uppercase; margin-bottom: 5px; flex-shrink: 0;
    }

    /* ── WRITE PANEL ── */
    .idea-wrap {
      flex: 1; display: flex; flex-direction: column;
      padding: 11px 13px 0; min-height: 0; position: relative;
    }

    #idea-area {
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      font-weight: 300; line-height: 1.9; color: var(--text);
      background: transparent; border: none; outline: none;
      resize: none; width: 100%; flex: 1; min-height: 0;
      -webkit-user-select: text; user-select: text;
    }

    #idea-area::placeholder { color: var(--text3); font-style: italic; }

    #syl-overlay {
      position: absolute; top: 25px; right: 2px;
      pointer-events: none; width: 26px;
    }

    .syl-count {
      font-size: 9px; color: var(--text3); text-align: right;
      font-family: 'JetBrains Mono', monospace;
      height: 24.7px; display: flex; align-items: center; justify-content: flex-end;
    }

    .context-wrap { padding: 7px 13px 0; flex-shrink: 0; }

    .context-inner {
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: 7px; padding: 8px 11px;
    }

    #context-area {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 300;
      line-height: 1.65; color: var(--text2); background: transparent;
      border: none; outline: none; resize: none; width: 100%; height: 48px;
      -webkit-user-select: text; user-select: text;
    }

    #context-area::placeholder { color: var(--text3); }

    .tags-wrap { padding: 7px 13px 0; flex-shrink: 0; }
    .tags-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

    .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 2px 7px 2px 9px; border-radius: 10px;
      border: 0.5px solid var(--accent2); color: var(--accent);
      background: var(--accentbg); display: flex; align-items: center; gap: 4px;
    }

    .tag-x { font-size: 11px; color: var(--accent2); cursor: pointer; line-height: 1; }
    .tag-x:hover { color: var(--accent); }

    .tag-add {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 2px 9px; border-radius: 10px;
      border: 0.5px dashed var(--border2); color: var(--text3);
      background: transparent; cursor: pointer;
    }

    .tag-add:hover { color: var(--text2); }

    #tag-input {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      background: var(--bg2); border: 0.5px solid var(--accent);
      border-radius: 10px; padding: 2px 9px; color: var(--text);
      outline: none; width: 90px; display: none;
      -webkit-user-select: text; user-select: text;
    }

    /* ── SONGWRITER DRAWER ── */
    #tool-drawer {
      background: var(--bg2); border-top: 0.5px solid var(--border2);
      flex-shrink: 0; overflow: hidden; max-height: 0;
      transition: max-height 0.25s ease;
    }

    #tool-drawer.open { max-height: 340px; }

    .drawer-inner { padding: 10px 13px; }

    .drawer-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 8px;
    }

    .drawer-word { font-size: 14px; font-weight: 500; color: var(--accent); letter-spacing: 0.05em; }
    .drawer-meta { font-size: 10px; color: var(--text3); margin-top: 2px; }

    .source-toggle {
      display: flex; border: 0.5px solid var(--border); border-radius: 5px;
      overflow: hidden; margin-bottom: 10px;
    }

    .source-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 3px 10px; background: transparent; color: var(--text3);
      border: none; cursor: pointer; transition: all 0.15s; flex: 1; text-align: center;
      outline: none;
    }

    .source-btn.active { background: var(--bg3); color: var(--text); }
    .source-btn:hover:not(.active) { color: var(--text2); }

    .drawer-close {
      font-size: 10px; color: var(--text3); cursor: pointer;
      padding: 2px 6px; border-radius: 4px;
      border: 0.5px solid var(--border); background: transparent;
      font-family: 'JetBrains Mono', monospace; outline: none;
    }

    .drawer-close:hover { color: var(--text2); }

    .drawer-scroll { max-height: 260px; overflow-y: auto; }
    .drawer-section { margin-bottom: 10px; }

    .drawer-label {
      font-size: 9px; font-weight: 500; letter-spacing: 0.12em;
      color: var(--text3); text-transform: uppercase; margin-bottom: 5px;
    }

    .rhyme-group { margin-bottom: 5px; }
    .rhyme-group-label { font-size: 9px; color: var(--text3); margin-bottom: 3px; }
    .rhyme-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; }

    .rhyme-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 2px 8px; border-radius: 8px;
      border: 0.5px solid var(--border2); color: var(--text2);
      background: var(--bg3); cursor: pointer; transition: all 0.12s;
    }

    .rhyme-chip:hover { color: var(--text); border-color: var(--accent2); }
    .rhyme-chip.perfect { border-color: var(--accent2); color: var(--accent); background: var(--accentbg); }

    .syn-chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; }

    .syn-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 2px 8px; border-radius: 8px;
      border: 0.5px solid var(--border); color: var(--text2);
      background: transparent; cursor: pointer; transition: all 0.12s;
      display: flex; align-items: center; gap: 4px;
    }

    .syn-chip:hover { color: var(--text); border-color: var(--border2); background: var(--bg3); }
    .syn-chip.rhymes { border-color: var(--accent2); color: var(--accent); background: var(--accentbg); }

    .rhyme-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .drawer-loading { font-size: 10px; color: var(--text3); font-style: italic; }

    .verse-row { padding: 6px 0; border-bottom: 0.5px solid var(--border); cursor: pointer; }
    .verse-row:last-child { border-bottom: none; }
    .verse-row:hover { opacity: 0.8; }
    .verse-ref { font-size: 10px; font-weight: 500; color: var(--accent); margin-bottom: 2px; letter-spacing: 0.04em; }
    .verse-text { font-size: 11px; color: var(--text2); line-height: 1.5; font-weight: 300; }
    .verse-text mark { background: var(--accentbg); color: var(--accent); border-radius: 2px; padding: 0 1px; }

    .feel-group { margin-bottom: 6px; }
    .feel-group-label { font-size: 9px; color: var(--text3); margin-bottom: 3px; }
    .feel-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .feel-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 2px 7px; border-radius: 8px;
      border: 0.5px solid var(--border); color: var(--text3);
      background: transparent; cursor: pointer; transition: all 0.12s;
    }
    .feel-chip:hover { color: var(--text2); }

    /* ── BUTTONS ── */
    .btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 10px; border-radius: 5px;
      border: 0.5px solid var(--border2); color: var(--text2);
      background: transparent; cursor: pointer;
      letter-spacing: 0.04em; transition: all 0.15s; white-space: nowrap; outline: none;
    }

    .btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--bg2); }
    .btn.accent { border-color: var(--accent2); color: var(--accent); background: var(--accentbg); }
    .btn.accent:hover { background: rgba(200,146,42,0.18); }
    .btn.active-toggle { background: var(--bg3); color: var(--text); }

    /* ── FOOTERS ── */
    .panel-footer {
      padding: 8px 13px; border-top: 0.5px solid var(--border);
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
      background: var(--bg);
    }

    .footer-spacer { flex: 1; }

    .footer-hint {
      font-size: 9px; color: var(--text3); letter-spacing: 0.03em;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }

    .panel-footer:hover .footer-hint { opacity: 1; }

    #win-mode-btn, #win-mode-btn-plan {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 9px; border-radius: 5px;
      border: 0.5px solid var(--border); color: var(--text3);
      background: var(--bg); cursor: pointer;
      transition: all 0.15s; letter-spacing: 0.04em; outline: none;
    }

    #win-mode-btn:hover, #win-mode-btn-plan:hover { color: var(--text2); }
    #win-mode-btn.active, #win-mode-btn-plan.active { color: var(--accent); border-color: var(--accent2); }

    /* ── MARKDOWN HINT ── */
    #markdown-hint {
      display: none; position: fixed;
      bottom: 50px; left: 13px; right: 13px;
      background: var(--bg3); border: 0.5px solid var(--border2);
      border-radius: 8px; padding: 11px 13px; z-index: 200;
      font-size: 11px; color: var(--text2); line-height: 1.8;
    }

    /* ── PLAN PANEL ── */
    .plan-context { padding: 7px 13px 0; flex-shrink: 0; }

    #plan-context-input {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 300;
      color: var(--text3); background: transparent;
      border: none; border-bottom: 0.5px solid var(--border);
      outline: none; width: 100%; padding-bottom: 6px;
      -webkit-user-select: text; user-select: text; transition: color 0.15s;
    }

    #plan-context-input:focus { color: var(--text2); }
    #plan-context-input::placeholder { color: var(--text3); }

    .plan-notes-wrap {
      flex: 1; display: flex; flex-direction: column;
      padding: 9px 13px 0; min-height: 0;
    }

    #admin-area {
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      font-weight: 300; line-height: 1.9; color: var(--text);
      background: transparent; border: none; outline: none;
      resize: none; width: 100%; flex: 1; min-height: 0; height: 100%;
      -webkit-user-select: text; user-select: text;
    }

    #admin-area::placeholder { color: var(--text3); font-style: italic; }

    .admin-divider { height: 0.5px; background: var(--border); margin: 8px 13px 0; flex-shrink: 0; }

    .task-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 13px 4px; flex-shrink: 0;
    }

    .task-header-label {
      font-size: 9px; font-weight: 500; letter-spacing: 0.14em;
      color: var(--text3); text-transform: uppercase;
    }

    #task-count { font-size: 10px; color: var(--text3); }

    .task-section { overflow-y: auto; padding: 0 13px; max-height: 280px; }

    .task-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-bottom: 0.5px solid var(--border);
    }

    .task-row:last-child { border-bottom: none; }

    .task-check {
      width: 14px; height: 14px; border-radius: 50%;
      border: 0.5px solid var(--text3); flex-shrink: 0; margin-top: 2px;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }

    .task-check.done { background: var(--success); border-color: var(--success); }

    .task-check.done::after {
      content: ''; display: block; width: 4px; height: 3px;
      border-left: 1.5px solid #1c1c1e; border-bottom: 1.5px solid #1c1c1e;
      transform: rotate(-45deg) translateY(-1px);
    }

    .task-body { flex: 1; min-width: 0; }

    .task-text {
      font-size: 12px; color: var(--text); line-height: 1.5;
      outline: none; -webkit-user-select: text; user-select: text;
    }

    .task-text.done { color: var(--text3); text-decoration: line-through; }

    .task-actions { display: flex; gap: 5px; margin-top: 3px; align-items: center; flex-wrap: wrap; }

    .task-reminder-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      color: var(--text3); background: transparent;
      border: 0.5px solid var(--border); border-radius: 4px;
      padding: 1px 5px; cursor: pointer; transition: all 0.15s; outline: none;
    }

    .task-reminder-btn:hover { color: var(--accent); border-color: var(--accent2); }
    .task-reminder-btn.set { color: var(--accent); border-color: var(--accent2); }

    .task-reminder-info { font-size: 9px; color: var(--accent2); letter-spacing: 0.02em; }

    .reminder-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0; margin-top: 4px;
    }

    .task-delete-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--text3); background: transparent; border: none;
      cursor: pointer; padding: 0 3px; outline: none;
      transition: color 0.12s; margin-left: auto;
    }

    .task-delete-btn:hover { color: var(--danger); }

    .empty-tasks {
      font-size: 11px; color: var(--text3); font-style: italic;
      padding: 12px 0; text-align: center;
    }

    /* ── REMINDER POPUP ── */
    #reminder-popup {
      display: none; position: fixed;
      bottom: 60px; left: 13px; right: 13px;
      background: var(--bg3); border: 0.5px solid var(--border2);
      border-radius: 8px; padding: 11px 13px; z-index: 200;
    }

    #reminder-popup.open { display: block; }

    .reminder-title { font-size: 11px; color: var(--text2); margin-bottom: 9px; line-height: 1.4; }
    .reminder-title strong { color: var(--text); font-weight: 500; }

    .reminder-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
    .reminder-label { font-size: 10px; color: var(--text3); width: 30px; flex-shrink: 0; }

    .reminder-input {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      background: var(--bg2); border: 0.5px solid var(--border2);
      border-radius: 5px; padding: 4px 8px; color: var(--text);
      outline: none; flex: 1; -webkit-user-select: text; user-select: text;
    }

    .reminder-input:focus { border-color: var(--accent2); }

    .reminder-repeat {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      background: var(--bg2); border: 0.5px solid var(--border2);
      border-radius: 5px; padding: 4px 8px; color: var(--text2);
      outline: none; flex: 1; cursor: pointer;
    }

    .reminder-footer { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  </style>
</head>
<body>

  <div id="topbar">
    <span id="app-name">S†AVE</span>
    <div class="topbar-right">
      <button class="topbar-icon-btn" onclick="openSearch()" title="search notes (⌘F)">⌕</button>
      <button class="topbar-icon-btn" onclick="openReminders()" title="reminders (⌘R)" style="padding:0;">
        <img src="bell-transparent.png" width="14" height="14">
      </button>
      <button class="topbar-icon-btn" onclick="openLockIn()" title="lock in" style="width:auto;padding:2px 8px;font-size:10px;letter-spacing:0.05em;">lock in</button>
      <div id="mode-toggle">
  <button class="mode-btn active" id="btn-write" onclick="setNewTabMode('write')">write</button>
  <button class="mode-btn" id="btn-plan" onclick="setNewTabMode('plan')">plan</button>
  
</div>
      
    </div>
  </div>

  <!-- TAB BAR -->
  <div id="tab-bar">
    <button id="tab-add" onclick="newTab()" title="new tab (⌘T)">+</button>
  </div>

  <div id="note-meta-bar">
    <input id="note-title" placeholder="untitled..." spellcheck="false">
    <div id="note-meta"></div>
  </div>

  <div id="panel-wrap">

    <!-- WRITE PANEL -->
    <div id="panel-write" class="panel active">
      <div class="idea-wrap">
        <div class="field-label">write</div>
        <div id="syl-overlay"></div>
        <textarea id="idea-area" placeholder="write anything..." spellcheck="true"></textarea>
      </div>
      <div class="context-wrap">
        <div class="context-inner">
          <div class="field-label">context</div>
          <textarea id="context-area" placeholder="when · why · key · singer · season..." spellcheck="false"></textarea>
        </div>
      </div>
      <div class="tags-wrap">
        <div class="tags-row" id="tags-row">
          <input id="tag-input" placeholder="tag...">
          <button class="tag-add" onclick="showTagInput()">+ tag</button>
        </div>
      </div>
      <div class="panel-footer">
        <button class="btn" onclick="showMarkdownHint()">?</button>
        <div class="footer-spacer"></div>
        <span class="footer-hint">⌘b bold · ⌘i italic · ⌘t new tab · ⌘f search</span>
        <button class="btn" onclick="exportPDF()">export</button>
        <button id="win-mode-btn" onclick="cycleWinMode()">hide</button>
      </div>

      <div id="markdown-hint">
        <div style="font-size:9px;font-weight:500;letter-spacing:0.12em;color:var(--text3);text-transform:uppercase;margin-bottom:6px;">markdown shortcuts</div>
        <div><span style="color:var(--accent)">⌘B</span> &nbsp;**bold**</div>
        <div><span style="color:var(--accent)">⌘I</span> &nbsp;_italic_</div>
        <div>&gt; line &nbsp;·&nbsp; - bullet (auto •)</div>
        <div style="margin-top:6px;cursor:pointer;color:var(--text3);" onclick="hideMarkdownHint()">close</div>
      </div>

      <div id="tool-drawer">
        <div class="drawer-inner">
          <div class="drawer-top">
            <div>
              <div class="drawer-word" id="drawer-word"></div>
              <div class="drawer-meta" id="drawer-meta"></div>
            </div>
            <button class="drawer-close" onclick="closeDrawer()">close</button>
          </div>
          <div class="source-toggle">
            <button class="source-btn active" id="src-general" onclick="setSource('general')">general</button>
            <button class="source-btn" id="src-songs" onclick="setSource('songs')">songs</button>
            <button class="source-btn" id="src-scripture" onclick="setSource('scripture')">scripture</button>
          </div>
          <div class="drawer-scroll" id="drawer-content"></div>
        </div>
      </div>
    </div>

    <!-- PLAN PANEL -->
    <div id="panel-plan" class="panel">
      <div class="plan-context">
        <input id="plan-context-input" placeholder="meeting · location · date" spellcheck="false">
      </div>
      <div class="plan-notes-wrap">
        <div class="field-label" style="margin-top:8px;">notes</div>
        <textarea id="admin-area"
          placeholder="stream of thought...&#10;start a line with >> to flag a task"
          spellcheck="true"></textarea>
      </div>
      <div class="admin-divider"></div>
      <div class="task-header">
        <span class="task-header-label">tasks</span>
        <span id="task-count"></span>
      </div>
      <div class="task-section" id="task-list">
        <div class="empty-tasks">no tasks yet — hit extract below</div>
      </div>
      <div class="panel-footer" style="position:relative;">
        <button class="btn" onclick="extractTasks()">extract tasks</button>
        <div class="footer-spacer"></div>
        <span class="footer-hint">⌘t new tab · ⌘f search · ⌘s save</span>
        <button id="win-mode-btn-plan" onclick="cycleWinMode()">hide</button>
        <div id="reminder-popup">
          <div class="reminder-title">reminder: <strong id="reminder-task-label"></strong></div>
          <div class="reminder-row">
            <span class="reminder-label">date</span>
            <input class="reminder-input" type="date" id="reminder-date">
          </div>
          <div class="reminder-row">
            <span class="reminder-label">time</span>
            <input class="reminder-input" type="time" id="reminder-time" step="1800">
          </div>
          <div class="reminder-row">
            <span class="reminder-label">repeat</span>
            <select class="reminder-repeat" id="reminder-repeat">
              <option value="none">no repeat</option>
              <option value="daily">daily</option>
              <option value="weekly">weekly</option>
            </select>
          </div>
          <div class="reminder-footer">
            <button class="btn" onclick="closeReminder()">cancel</button>
            <button class="btn accent" onclick="setReminder()">set reminder</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
