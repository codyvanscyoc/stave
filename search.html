<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S†AVE — Search</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1c1c1e;
      --bg2:      #252528;
      --bg3:      #2e2e32;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.13);
      --text:     #f0e8d8;
      --text2:    #9a9080;
      --text3:    #4e4a44;
      --accent:   #c8922a;
      --accent2:  #a07420;
      --accentbg: rgba(200,146,42,0.10);
      --teal:     #4caf7d;
      --tealbg:   rgba(76,175,125,0.10);
      --teal2:    #2e8a57;
    }

    html, body {
      width: 100%; height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 0.5px solid var(--border);
      -webkit-app-region: drag; flex-shrink: 0;
    }

    #titlebar-name { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--accent); }

    #close-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 3px 8px; border-radius: 5px;
      border: 0.5px solid var(--border2); color: var(--text3);
      background: transparent; cursor: pointer;
      -webkit-app-region: no-drag; transition: all 0.15s;
    }

    #close-btn:hover { color: var(--text2); }

    #search-bar {
      padding: 10px 14px; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    }

    #search-input {
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      width: 100%; background: var(--bg2);
      border: 0.5px solid var(--border2); border-radius: 6px;
      padding: 8px 12px; color: var(--text); outline: none;
      -webkit-user-select: text; user-select: text;
    }

    #search-input:focus { border-color: var(--accent2); }
    #search-input::placeholder { color: var(--text3); }

    #results-meta {
      font-size: 10px; color: var(--text3);
      padding: 6px 14px 4px; flex-shrink: 0;
    }

    #results-list { flex: 1; overflow-y: auto; padding: 4px 0; }

    .result-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 14px; cursor: pointer;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.12s;
    }

    .result-row:hover { background: var(--bg2); }
    .result-row:last-child { border-bottom: none; }

    .result-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
    }

    .dot-write { background: var(--accent); }
    .dot-plan  { background: var(--teal); }

    .result-body { flex: 1; min-width: 0; }

    .result-title {
      font-size: 13px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .result-meta { font-size: 10px; color: var(--text3); margin-top: 2px; }

    .result-snippet {
      font-size: 11px; font-weight: 300; color: var(--text2);
      margin-top: 3px; line-height: 1.5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .result-snippet mark {
      background: var(--accentbg); color: var(--accent);
      border-radius: 2px; padding: 0 1px;
    }

    .result-mode {
      font-size: 9px; padding: 2px 6px; border-radius: 8px;
      font-weight: 500; flex-shrink: 0; margin-top: 2px;
    }

    .mode-write { background: var(--accentbg); color: var(--accent); border: 0.5px solid var(--accent2); }
    .mode-plan  { background: var(--tealbg);   color: var(--teal);   border: 0.5px solid var(--teal2); }

    #empty-state {
      display: flex; align-items: center; justify-content: center;
      flex: 1; font-size: 12px; color: var(--text3); font-style: italic;
    }

    .legend {
      display: flex; gap: 14px; padding: 8px 14px;
      border-top: 0.5px solid var(--border); flex-shrink: 0;
    }

    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text3); }
    .legend-dot { width: 6px; height: 6px; border-radius: 50%; }
  </style>
</head>
<body>

  <div id="titlebar">
    <span id="titlebar-name">S†AVE — notes</span>
    <button id="close-btn" onclick="closeSearch()">close</button>
  </div>

  <div id="search-bar">
    <input id="search-input" placeholder="search titles and content..." autofocus spellcheck="false">
  </div>

  <div id="results-meta"></div>

  <div id="results-list">
    <div id="empty-state">loading notes...</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-write"></div>write</div>
    <div class="legend-item"><div class="legend-dot dot-plan"></div>plan</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    let allNotes = []
    let query = ''

    function closeSearch() { ipcRenderer.send('close-search') }

    function openNote(filename, mode) {
      ipcRenderer.send('search-open-note', { filename, mode })
    }

    function formatDate(mtime) {
      const d = new Date(mtime)
      return `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}/${d.getFullYear().toString().slice(2)}`
    }

    function getSnippet(raw, query) {
      if (!query) {
        const lines = raw.split('\n').filter(l => l.trim() && !l.startsWith('#') && !l.startsWith('type:') && !l.startsWith('tags:') && !l.startsWith('##') && !l.startsWith('context1:'))
        return lines[0]?.trim().slice(0, 80) || ''
      }
      const lower = raw.toLowerCase()
      const idx = lower.indexOf(query.toLowerCase())
      if (idx === -1) return ''
      const start = Math.max(0, idx - 30)
      const end = Math.min(raw.length, idx + query.length + 50)
      let snippet = (start > 0 ? '…' : '') + raw.slice(start, end) + (end < raw.length ? '…' : '')
      const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi')
      snippet = snippet.replace(regex, m => `<mark>${m}</mark>`)
      return snippet
    }

    function renderResults(notes) {
      const list = document.getElementById('results-list')
      const meta = document.getElementById('results-meta')

      list.innerHTML = ''

      if (!notes.length) {
        const empty = document.createElement('div')
        empty.id = 'empty-state'
        empty.textContent = query ? 'no results found' : 'no notes yet'
        list.appendChild(empty)
        meta.textContent = ''
        return
      }

      meta.textContent = `${notes.length} note${notes.length !== 1 ? 's' : ''}${query ? ` matching "${query}"` : ''}`

      notes.forEach(note => {
        const row = document.createElement('div')
        row.className = 'result-row'
        row.onclick = () => openNote(note.filename, note.mode)

        const dot = document.createElement('div')
        dot.className = `result-dot dot-${note.mode}`

        const body = document.createElement('div')
        body.className = 'result-body'

        const title = document.createElement('div')
        title.className = 'result-title'
        title.textContent = note.title || note.filename.replace('.md','')

        const metaEl = document.createElement('div')
        metaEl.className = 'result-meta'
        metaEl.textContent = formatDate(note.mtime)

        const snippet = document.createElement('div')
        snippet.className = 'result-snippet'
        snippet.innerHTML = getSnippet(note.raw, query)

        const modeTag = document.createElement('span')
        modeTag.className = `result-mode mode-${note.mode}`
        modeTag.textContent = note.mode

        body.appendChild(title)
        body.appendChild(metaEl)
        if (snippet.innerHTML) body.appendChild(snippet)

        row.appendChild(dot)
        row.appendChild(body)
        row.appendChild(modeTag)
        list.appendChild(row)
      })
    }

    function filterNotes(q) {
      if (!q) return allNotes
      const lower = q.toLowerCase()
      return allNotes.filter(n =>
        n.title.toLowerCase().includes(lower) ||
        n.raw.toLowerCase().includes(lower)
      )
    }

    // load all notes
    ipcRenderer.send('get-all-notes')
    ipcRenderer.on('all-notes', (event, notes) => {
      allNotes = notes
      renderResults(allNotes)
    })

    document.getElementById('search-input').addEventListener('input', e => {
      query = e.target.value.trim()
      renderResults(filterNotes(query))
    })

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSearch()
    })
  </script>
</body>
</html>
