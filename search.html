<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S†AVE — Search</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1c1c1e;
      --bg2:     #252528;
      --bg3:     #2e2e32;
      --border:  rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text:    #f0e8d8;
      --text2:   #9a9080;
      --text3:   #4e4a44;
      --accent:  #c8922a;
      --accent2: #a07420;
      --write:   #c8922a;
      --plan:    #4caf7d;
      --project: #7f77dd;
      --longform:#378add;
    }

    html, body {
      width: 100%; height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #titlebar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 0.5px solid var(--border);
      -webkit-app-region: drag; flex-shrink: 0;
    }

    #search-input {
      flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 13px;
      background: transparent; border: none; outline: none; color: var(--text);
      -webkit-user-select: text; user-select: text;
      -webkit-app-region: no-drag;
    }

    #search-input::placeholder { color: var(--text3); }

    #close-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 3px 8px; border-radius: 5px;
      border: 0.5px solid var(--border2); color: var(--text3);
      background: transparent; cursor: pointer; outline: none;
      -webkit-app-region: no-drag; transition: all 0.15s;
    }

    #close-btn:hover { color: var(--text2); }

    /* ── FILTER BAR ── */
    #filter-bar {
      display: flex; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    }

    .filter-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 7px 0; background: transparent; color: var(--text3);
      border: none; cursor: pointer; transition: all 0.15s;
      flex: 1; text-align: center; letter-spacing: 0.05em;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      outline: none;
    }

    .filter-btn.active { color: var(--text); border-bottom: 1.5px solid currentColor; }
    .filter-btn:hover:not(.active) { color: var(--text2); }

    .filter-btn#f-all.active    { color: var(--text); border-color: var(--text2); }
    .filter-btn#f-write.active  { color: var(--write); border-color: var(--write); }
    .filter-btn#f-plan.active   { color: var(--plan); border-color: var(--plan); }
    .filter-btn#f-project.active { color: var(--project); border-color: var(--project); }
    .filter-btn#f-longform.active { color: var(--longform); border-color: var(--longform); }

    .filter-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }

    #results-meta {
      font-size: 10px; color: var(--text3);
      padding: 6px 14px 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }

    #results-list { flex: 1; overflow-y: auto; }

    .result-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px; border-bottom: 0.5px solid var(--border);
      cursor: pointer; transition: background 0.12s;
    }

    .result-row:hover { background: var(--bg2); }
    .result-row:last-child { border-bottom: none; }

    .result-dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex-shrink: 0; margin-top: 4px;
    }

    .result-body { flex: 1; min-width: 0; }

    .result-title {
      font-size: 12px; font-weight: 500; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-bottom: 3px;
    }

    .result-title mark {
      background: var(--accentbg, rgba(200,146,42,0.15));
      color: var(--accent); border-radius: 2px; padding: 0 1px;
    }

    .result-preview {
      font-size: 10px; color: var(--text3); line-height: 1.5;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 300;
    }

    .result-preview mark { color: var(--text2); background: transparent; }

    .result-meta {
      font-size: 9px; color: var(--text3); margin-top: 3px;
      display: flex; align-items: center; gap: 6px;
    }

    .result-type {
      font-size: 9px; padding: 1px 5px; border-radius: 4px;
      border: 0.5px solid currentColor; letter-spacing: 0.05em;
    }

    .result-actions {
      display: flex; gap: 4px; flex-shrink: 0; align-items: flex-start;
      padding-top: 2px;
    }

    .result-delete {
      font-size: 11px; color: var(--text3); cursor: pointer;
      padding: 2px 5px; border-radius: 4px;
      border: 0.5px solid var(--border); background: transparent;
      font-family: 'JetBrains Mono', monospace; outline: none;
      transition: all 0.12s; opacity: 0;
    }

    .result-row:hover .result-delete { opacity: 1; }
    .result-delete:hover { color: #c0392b; border-color: #c0392b; }

    .empty-state {
      display: flex; align-items: center; justify-content: center;
      flex: 1; font-size: 12px; color: var(--text3); font-style: italic;
    }
  </style>
</head>
<body>

  <div id="titlebar">
    <input id="search-input" placeholder="search notes..." spellcheck="false" autofocus>
    <button id="close-btn" onclick="closeSearch()">close</button>
  </div>

  <div id="filter-bar">
    <button class="filter-btn active" id="f-all" onclick="setFilter('all')">all</button>
    <button class="filter-btn" id="f-write" onclick="setFilter('write')">
      <span class="filter-dot" style="background:#c8922a"></span>write
    </button>
    <button class="filter-btn" id="f-plan" onclick="setFilter('plan')">
      <span class="filter-dot" style="background:#4caf7d"></span>plan
    </button>
    <button class="filter-btn" id="f-project" onclick="setFilter('project')">
      <span class="filter-dot" style="background:#7f77dd"></span>project
    </button>
    <button class="filter-btn" id="f-longform" onclick="setFilter('longform')">
      <span class="filter-dot" style="background:#378add"></span>longform
    </button>
  </div>

  <div id="results-meta"></div>

  <div id="results-list">
    <div class="empty-state">start typing to search</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')
    const fs = require('fs')
    const path = require('path')

    let allNotes = []
    let currentFilter = 'all'
    let searchQuery = ''

    const MODE_COLORS = {
      write:    '#c8922a',
      plan:     '#4caf7d',
      project:  '#7f77dd',
      longform: '#378add'
    }

    function closeSearch() { ipcRenderer.send('close-search') }

    function setFilter(f) {
      currentFilter = f
      ;['all','write','plan','project','longform'].forEach(id => {
        document.getElementById('f-' + id).classList.toggle('active', id === f)
      })
      renderResults()
    }

    function highlight(text, query) {
      if (!query) return text
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`)
    }

    function renderResults() {
      const list = document.getElementById('results-list')
      const meta = document.getElementById('results-meta')
      list.innerHTML = ''

      let filtered = allNotes
      if (currentFilter !== 'all') filtered = allNotes.filter(n => n.mode === currentFilter)

      if (searchQuery) {
        const q = searchQuery.toLowerCase()
        filtered = filtered.filter(n =>
          n.title.toLowerCase().includes(q) ||
          n.raw.toLowerCase().includes(q)
        )
      }

      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state">${searchQuery ? 'no results found' : 'no notes yet'}</div>`
        meta.textContent = ''
        return
      }

      meta.innerHTML = `<span>${filtered.length} note${filtered.length !== 1 ? 's' : ''}</span>`

      filtered.forEach(note => {
        const row = document.createElement('div')
        row.className = 'result-row'

        const dot = document.createElement('div')
        dot.className = 'result-dot'
        dot.style.background = MODE_COLORS[note.mode] || '#9a9080'

        const body = document.createElement('div')
        body.className = 'result-body'

        const title = document.createElement('div')
        title.className = 'result-title'
        title.innerHTML = highlight(note.title || 'untitled', searchQuery)

        // preview — find matching line
        let preview = ''
        if (searchQuery) {
          const q = searchQuery.toLowerCase()
          const lines = note.raw.split('\n').filter(l => !l.startsWith('#') && !l.startsWith('type:') && !l.startsWith('tags:'))
          const matchLine = lines.find(l => l.toLowerCase().includes(q))
          if (matchLine) preview = highlight(matchLine.trim().slice(0, 80), searchQuery)
        }
        if (!preview) {
          const lines = note.raw.split('\n').filter(l => l.trim() && !l.startsWith('#') && !l.startsWith('type:') && !l.startsWith('tags:') && !l.startsWith('##'))
          preview = lines[0]?.trim().slice(0, 80) || ''
        }

        const previewEl = document.createElement('div')
        previewEl.className = 'result-preview'
        previewEl.innerHTML = preview

        const metaEl = document.createElement('div')
        metaEl.className = 'result-meta'

        const typeEl = document.createElement('span')
        typeEl.className = 'result-type'
        typeEl.textContent = note.mode
        typeEl.style.color = MODE_COLORS[note.mode] || '#9a9080'

        const dateEl = document.createElement('span')
        try {
          const d = new Date(note.mtime)
          dateEl.textContent = `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}/${d.getFullYear().toString().slice(2)}`
        } catch(e) {}

        metaEl.appendChild(typeEl)
        metaEl.appendChild(dateEl)
        body.appendChild(title)
        if (preview) body.appendChild(previewEl)
        body.appendChild(metaEl)

        // actions
        const actions = document.createElement('div')
        actions.className = 'result-actions'

        const deleteBtn = document.createElement('button')
        deleteBtn.className = 'result-delete'
        deleteBtn.textContent = '×'
        deleteBtn.title = 'delete note'
        deleteBtn.onclick = (e) => {
          e.stopPropagation()
          if (confirm(`Delete "${note.title || 'untitled'}"? This cannot be undone.`)) {
            try {
              fs.unlinkSync(note.filepath)
              allNotes = allNotes.filter(n => n.filepath !== note.filepath)
              renderResults()
            } catch(err) {
              alert('Could not delete note: ' + err.message)
            }
          }
        }

        actions.appendChild(deleteBtn)

        row.appendChild(dot)
        row.appendChild(body)
        row.appendChild(actions)

        row.onclick = () => {
          ipcRenderer.send('search-open-note', { filename: note.filename, mode: note.mode })
        }

        list.appendChild(row)
      })
    }

    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value.trim()
      renderResults()
    })

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSearch()
    })

    ipcRenderer.send('get-all-notes')
    ipcRenderer.on('all-notes', (event, notes) => {
      allNotes = notes
      renderResults()
    })
  </script>
</body>
</html>
