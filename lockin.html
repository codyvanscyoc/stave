<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lock In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    .room-stave {
      --bg:     #1c1c1e; --bg2: #252528;
      --text:   #f0e8d8; --text2: #9a9080; --text3: #4e4a44;
      --accent: #c8922a; --accent2: #a07420;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
      --font:   'JetBrains Mono', monospace; --size: 16px; --weight: 300; --lh: 2.2;
    }

    .room-manuscript {
      --bg:     #f5f0e8; --bg2: #ede8df;
      --text:   #2c2418; --text2: #7a6e5e; --text3: #b0a898;
      --accent: #8b4513; --accent2: #6b3410;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
      --font:   Georgia, serif; --size: 17px; --weight: 400; --lh: 2.1;
    }

    .room-midnight {
      --bg:     #0d1117; --bg2: #161b22;
      --text:   #cdd9e5; --text2: #768390; --text3: #444c56;
      --accent: #4caf7d; --accent2: #2e8a57;
      --border: rgba(255,255,255,0.05); --border2: rgba(255,255,255,0.1);
      --font:   'JetBrains Mono', monospace; --size: 16px; --weight: 300; --lh: 2.2;
    }

    .room-parchment {
      --bg:     #fdf6e3; --bg2: #f5edd4;
      --text:   #3d2b1f; --text2: #8c7055; --text3: #c4a882;
      --accent: #8b4513; --accent2: #6b3410;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
      --font:   Georgia, serif; --size: 17px; --weight: 400; --lh: 2.1;
    }

    .room-terminal {
      --bg:     #000000; --bg2: #0a0a0a;
      --text:   #00ff41; --text2: #00cc33; --text3: #006616;
      --accent: #00ff41; --accent2: #00cc33;
      --border: rgba(0,255,65,0.1); --border2: rgba(0,255,65,0.2);
      --font:   'JetBrains Mono', monospace; --size: 15px; --weight: 400; --lh: 2.0;
    }

    html, body {
      width: 100%; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font); -webkit-font-smoothing: antialiased;
      transition: background 0.4s ease, color 0.4s ease;
      display: flex; flex-direction: column;
    }

    /* ── TOP BAR ── */
    #top-bar {
      height: 44px; display: flex; align-items: center;
      padding: 0 24px; -webkit-app-region: drag;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0; background: var(--bg);
    }

    #stave-mark {
      font-size: 13px; font-weight: 500; color: var(--accent);
      opacity: 0.35; letter-spacing: 0.1em;
      -webkit-app-region: no-drag;
      font-family: 'JetBrains Mono', monospace;
    }

    #top-drag { flex: 1; }

    #exit-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 12px; border-radius: 5px;
      border: 0.5px solid var(--text3); color: var(--text3);
      background: transparent; cursor: pointer;
      transition: all 0.15s; -webkit-app-region: no-drag; outline: none;
    }

    #exit-btn:hover { color: var(--text); border-color: var(--text2); }

    /* ── FORMAT TOOLBAR ── */
    #fmt-toolbar {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 24px; border-bottom: 0.5px solid var(--border);
      flex-shrink: 0; background: var(--bg);
    }

    .fmt-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 2px 8px; border-radius: 4px;
      border: 0.5px solid var(--border2); color: var(--text3);
      background: transparent; cursor: pointer; outline: none;
      transition: all 0.12s; line-height: 1.5;
    }

    .fmt-btn:hover { color: var(--text); border-color: var(--border2); }
    .fmt-sep { width: 0.5px; height: 14px; background: var(--border2); margin: 0 3px; flex-shrink: 0; }

    /* ── MAIN LAYOUT ── */
    #layout {
      display: flex; flex: 1; min-height: 0;
    }

    /* ── OUTLINE SIDEBAR ── */
    #outline-sidebar {
      width: 200px; flex-shrink: 0;
      padding: 30px 16px 60px 24px;
      overflow-y: auto; opacity: 0;
      transition: opacity 0.3s ease; pointer-events: none;
      border-right: 0.5px solid var(--border);
    }

    #outline-sidebar.visible { opacity: 1; pointer-events: all; }
    #outline-sidebar::-webkit-scrollbar { width: 2px; }
    #outline-sidebar::-webkit-scrollbar-thumb { background: var(--text3); border-radius: 2px; }

    .outline-label {
      font-size: 9px; font-weight: 500; letter-spacing: 0.14em;
      color: var(--text3); text-transform: uppercase; margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
    }

    .outline-item {
      font-size: 11px; color: var(--text3); line-height: 1.6;
      cursor: pointer; padding: 2px 0;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.15s; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; user-select: none;
    }

    .outline-item:hover { color: var(--accent); }
    .outline-item.section { color: var(--accent); font-weight: 500; font-size: 10px; letter-spacing: 0.06em; }
    .outline-item.sub { padding-left: 10px; font-size: 10px; }
    .outline-divider { height: 0.5px; background: var(--text3); opacity: 0.3; margin: 6px 0; width: 60%; }

    /* ── WRITING COLUMN ── */
    #write-column {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; overflow-y: auto; min-width: 0;
      padding: 40px 40px 80px;
    }

    #write-column::-webkit-scrollbar { width: 3px; }
    #write-column::-webkit-scrollbar-thumb { background: var(--text3); opacity: 0.3; border-radius: 2px; }

    #doc-title {
      font-family: var(--font); font-size: 13px; font-weight: 500;
      color: var(--text3); letter-spacing: 0.06em;
      margin-bottom: 30px; text-align: center;
      width: 100%; max-width: 660px;
      text-transform: uppercase;
    }

    #editor {
      font-family: var(--font); font-size: var(--size);
      font-weight: var(--weight); line-height: var(--lh);
      color: var(--text); background: transparent;
      border: none; outline: none; resize: none;
      width: 100%; max-width: 660px;
      min-height: calc(100vh - 300px);
      -webkit-user-select: text; user-select: text;
      caret-color: var(--accent);
    }

    #editor::placeholder { color: var(--text3); font-style: italic; }

    /* ── SONGWRITER DRAWER ── */
#drawer-panel {
  width: 0; flex-shrink: 0; overflow: hidden;
  transition: width 0.25s ease;
  border-left: 0.5px solid var(--border);
  display: flex; flex-direction: column;
  background: var(--bg2);
}

#drawer-panel.open { width: 280px; }

#drawer-toggle {
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
  padding: 0 10px; background: transparent; border: none;
  color: var(--text3); cursor: pointer; outline: none;
  transition: color 0.15s; -webkit-app-region: no-drag;
  letter-spacing: 2px; line-height: 1;
}

#drawer-toggle:hover { color: var(--accent); }
#drawer-toggle.open { color: var(--accent); }

#drawer-inner {
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
}

#drawer-word-display {
  font-size: 15px; font-weight: 500; color: var(--accent);
  letter-spacing: 0.05em; padding: 14px 14px 4px;
  font-family: 'JetBrains Mono', monospace;
}

#drawer-meta-display {
  font-size: 10px; color: var(--text3);
  padding: 0 14px 10px; font-family: 'JetBrains Mono', monospace;
}

.drawer-source-toggle {
  display: flex; border-top: 0.5px solid var(--border);
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
}

.drawer-src-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 5px 0; background: transparent; color: var(--text3);
  border: none; cursor: pointer; transition: all 0.15s;
  flex: 1; text-align: center; outline: none;
}

.drawer-src-btn.active { background: var(--bg3); color: var(--text); }
.drawer-src-btn:hover:not(.active) { color: var(--text2); }

#drawer-scroll {
  flex: 1; overflow-y: auto; padding: 10px 14px;
}

#drawer-scroll::-webkit-scrollbar { width: 2px; }
#drawer-scroll::-webkit-scrollbar-thumb { background: var(--border2); }

.d-section { margin-bottom: 12px; }

.d-label {
  font-size: 9px; font-weight: 500; letter-spacing: 0.12em;
  color: var(--text3); text-transform: uppercase; margin-bottom: 5px;
  font-family: 'JetBrains Mono', monospace;
}

.d-chips { display: flex; flex-wrap: wrap; gap: 4px; }

.d-chip {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 7px; border-radius: 8px;
  border: 0.5px solid var(--border2); color: var(--text2);
  background: transparent; cursor: pointer; transition: all 0.12s;
}

.d-chip:hover { color: var(--text); border-color: var(--border2); background: var(--bg3); }
.d-chip.perfect { border-color: var(--accent2); color: var(--accent); background: var(--accentbg, rgba(200,146,42,0.1)); }
.d-chip.rhymes { border-color: var(--accent2); color: var(--accent); background: var(--accentbg, rgba(200,146,42,0.1)); }

.d-verse {
  padding: 6px 0; border-bottom: 0.5px solid var(--border); cursor: pointer;
}

.d-verse:last-child { border-bottom: none; }
.d-verse:hover { opacity: 0.8; }

.d-verse-ref {
  font-size: 10px; font-weight: 500; color: var(--accent);
  margin-bottom: 2px; font-family: 'JetBrains Mono', monospace;
}

.d-verse-text {
  font-size: 10px; color: var(--text2); line-height: 1.5;
  font-family: 'JetBrains Mono', monospace; font-weight: 300;
}

.d-verse-text mark {
  background: rgba(200,146,42,0.15); color: var(--accent);
  border-radius: 2px; padding: 0 1px;
}

.d-empty { font-size: 10px; color: var(--text3); font-style: italic; }

.d-group-label {
  font-size: 9px; color: var(--text3); margin-bottom: 3px;
  font-family: 'JetBrains Mono', monospace;
}
    /* ── RIGHT PANEL ── */
    #right-panel {
      width: 200px; flex-shrink: 0;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 0 24px 32px 16px;
    }

    #word-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--text3);
      text-align: right; letter-spacing: 0.06em;
      margin-bottom: 20px; opacity: 0.6;
    }

    #room-flash {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--text3);
      text-align: right; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 8px;
      opacity: 0; transition: opacity 0.3s;
    }

    #width-switcher {
      display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 12px;
    }

    #template-switcher {
      display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px;
    }

    #room-switcher {
      display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 20px;
    }

    .room-dot {
      width: 12px; height: 12px; border-radius: 50%;
      cursor: pointer; transition: transform 0.15s, opacity 0.15s;
      opacity: 0.5; border: 1.5px solid transparent;
    }

    .room-dot:hover { opacity: 0.9; transform: scale(1.2); }
    .room-dot.active { opacity: 1; border-color: var(--text2); transform: scale(1.1); }

    #dot-stave      { background: #c8922a; }
    #dot-manuscript { background: #8b4513; }
    #dot-midnight   { background: #4caf7d; }
    #dot-parchment  { background: #d4a96a; }
    #dot-terminal   { background: #00ff41; }
    #dot-blank      { background: #4e4a44; }
    #dot-sermon     { background: #378add; }
    #dot-essay      { background: #7f77dd; }
    #dot-study      { background: #4caf7d; }

    #controls {
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }

    .ctrl-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 10px; border-radius: 5px;
      border: 0.5px solid var(--text3); color: var(--text3);
      background: transparent; cursor: pointer;
      transition: all 0.15s; letter-spacing: 0.04em; outline: none;
    }

    .ctrl-btn:hover { color: var(--text); border-color: var(--text2); }
    .ctrl-btn.active { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body class="room-stave">

  <div id="top-bar">
    <span id="stave-mark">S†</span>
    <div id="top-drag"></div>
    <button id="drawer-toggle" onclick="toggleDrawer()" title="songwriter tools">≡</button>
    <button id="exit-btn" onclick="exitLockIn()">exit lock in</button>
  </div>

  <div id="fmt-toolbar">
    <button class="fmt-btn" onclick="fmtToggle('**')" title="bold (⌘B)"><strong>B</strong></button>
    <button class="fmt-btn" onclick="fmtToggle('_')" title="italic (⌘I)"><em>I</em></button>
    <div class="fmt-sep"></div>
    <button class="fmt-btn" onclick="fmtQuote()" title="blockquote">"</button>
    <button class="fmt-btn" onclick="fmtBullet()" title="bullet">•</button>
    <div class="fmt-sep"></div>
    <button class="fmt-btn" onclick="fmtSection()" title="section break">—</button>
  </div>

  <div id="layout">
    <div id="drawer-panel">
      <div id="drawer-inner">
        <div id="drawer-word-display">highlight a word</div>
        <div id="drawer-meta-display"></div>
        <div class="drawer-source-toggle">
          <button class="drawer-src-btn active" id="dsrc-general" onclick="setDrawerSource('general')">general</button>
          <button class="drawer-src-btn" id="dsrc-songs" onclick="setDrawerSource('songs')">songs</button>
          <button class="drawer-src-btn" id="dsrc-scripture" onclick="setDrawerSource('scripture')">scripture</button>
        </div>
        <div id="drawer-scroll">
          <div class="d-empty">highlight a word in your writing to look it up</div>
        </div>
      </div>
    </div>

    <div id="outline-sidebar">
      <div class="outline-label">outline</div>
      <div id="outline-items"></div>
    </div>

    <div id="write-column">
      <div id="doc-title"></div>
      <textarea id="editor" placeholder="write..."></textarea>
    </div>

    <div id="right-panel">
      <div id="word-count">0 words</div>
      <div id="room-flash"></div>

      <div id="width-switcher">
        <button class="ctrl-btn" id="w-narrow" onclick="setWidth('narrow')">narrow</button>
        <button class="ctrl-btn active" id="w-medium" onclick="setWidth('medium')">medium</button>
        <button class="ctrl-btn" id="w-wide" onclick="setWidth('wide')">wide</button>
      </div>

      <div id="template-switcher">
        <div class="room-dot" id="dot-blank"  onclick="applyTemplate('blank')"  title="blank"       style="background:#4e4a44;"></div>
        <div class="room-dot" id="dot-sermon" onclick="applyTemplate('sermon')" title="sermon"      style="background:#378add;"></div>
        <div class="room-dot" id="dot-essay"  onclick="applyTemplate('essay')"  title="essay"       style="background:#7f77dd;"></div>
        <div class="room-dot" id="dot-study"  onclick="applyTemplate('study')"  title="bible study" style="background:#4caf7d;"></div>
      </div>

      <div id="room-switcher">
        <div class="room-dot active" id="dot-stave"      onclick="setRoom('stave')"      title="stave"></div>
        <div class="room-dot"        id="dot-manuscript" onclick="setRoom('manuscript')"  title="manuscript"></div>
        <div class="room-dot"        id="dot-midnight"   onclick="setRoom('midnight')"    title="midnight"></div>
        <div class="room-dot"        id="dot-parchment"  onclick="setRoom('parchment')"   title="parchment"></div>
        <div class="room-dot"        id="dot-terminal"   onclick="setRoom('terminal')"    title="terminal"></div>
      </div>

      <div id="controls">
        <button class="ctrl-btn" id="outline-btn" onclick="toggleOutline()">outline</button>
      </div>
    </div>

  </div>

  <!-- TEMPLATE PICKER -->
  <div id="template-picker" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;">
    <div style="background:var(--bg3,#2e2e32);border:0.5px solid rgba(255,255,255,0.13);border-radius:10px;padding:24px;width:300px;">
      <div style="font-size:9px;font-weight:500;color:#4e4a44;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px;">choose template</div>
      <div id="template-options" style="display:flex;flex-direction:column;gap:8px;"></div>
      <div style="margin-top:12px;text-align:right;">
        <button onclick="skipTemplate()" style="font-family:JetBrains Mono,monospace;font-size:10px;padding:4px 10px;border-radius:5px;border:0.5px solid #4e4a44;color:#4e4a44;background:transparent;cursor:pointer;outline:none;">skip</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM POPUP -->
  <div id="confirm-popup" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:600;align-items:center;justify-content:center;">
    <div style="background:#2e2e32;border:0.5px solid rgba(255,255,255,0.13);border-radius:10px;padding:24px;width:280px;">
      <div id="confirm-message" style="font-size:12px;color:#9a9080;margin-bottom:16px;line-height:1.6;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="confirm-cancel" style="font-family:JetBrains Mono,monospace;font-size:10px;padding:5px 14px;border-radius:5px;border:0.5px solid #a07420;color:#c8922a;background:rgba(200,146,42,0.1);cursor:pointer;outline:none;">cancel</button>
        <button id="confirm-ok" style="font-family:JetBrains Mono,monospace;font-size:10px;padding:5px 14px;border-radius:5px;border:0.5px solid rgba(255,255,255,0.13);color:#4e4a44;background:transparent;cursor:pointer;outline:none;">clear</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')
    const fs = require('fs')

    let currentRoom = 'stave'
    let outlineVisible = false
    let currentFilepath = null
    let saveTimer = null
    let currentMode = 'write'
    let fmtModes = {}
    let drawerOpen = false
    let drawerSource = 'general'
    let lastDrawerData = null

    function toggleDrawer() {
      drawerOpen = !drawerOpen
      document.getElementById('drawer-panel').classList.toggle('open', drawerOpen)
      document.getElementById('drawer-toggle').classList.toggle('open', drawerOpen)
    }

    function setDrawerSource(src) {
      drawerSource = src
      ;['general','songs','scripture'].forEach(s => {
        document.getElementById('dsrc-' + s).classList.toggle('active', s === src)
      })
      if (lastDrawerData) renderDrawerResults(lastDrawerData)
    }

    ipcRenderer.on('drawer-results', (event, data) => {
      lastDrawerData = data
      document.getElementById('drawer-word-display').textContent = data.word
      document.getElementById('drawer-meta-display').textContent = `${data.syllables} syl`
      renderDrawerResults(data)
    })

    function renderDrawerResults(data) {
      const scroll = document.getElementById('drawer-scroll')
      scroll.innerHTML = ''

      if (drawerSource === 'general') {
        // rhymes
        const rhymeSection = document.createElement('div')
        rhymeSection.className = 'd-section'
        rhymeSection.innerHTML = '<div class="d-label">perfect rhymes</div>'
        const perfectChips = document.createElement('div')
        perfectChips.className = 'd-chips'
        if (data.rhymes.perfect.length) {
          data.rhymes.perfect.forEach(w => {
            const chip = document.createElement('div')
            chip.className = 'd-chip perfect'
            chip.textContent = w
            chip.onclick = () => insertWordToEditor(w)
            perfectChips.appendChild(chip)
          })
        } else {
          perfectChips.innerHTML = '<span class="d-empty">none found</span>'
        }
        rhymeSection.appendChild(perfectChips)

        const nearLabel = document.createElement('div')
        nearLabel.className = 'd-label'
        nearLabel.style.marginTop = '8px'
        nearLabel.textContent = 'near rhymes'
        rhymeSection.appendChild(nearLabel)

        const nearChips = document.createElement('div')
        nearChips.className = 'd-chips'
        if (data.rhymes.near.length) {
          data.rhymes.near.forEach(w => {
            const chip = document.createElement('div')
            chip.className = 'd-chip'
            chip.textContent = w
            chip.onclick = () => insertWordToEditor(w)
            nearChips.appendChild(chip)
          })
        } else {
          nearChips.innerHTML = '<span class="d-empty">none found</span>'
        }
        rhymeSection.appendChild(nearChips)
        scroll.appendChild(rhymeSection)

        // synonyms
        const synSection = document.createElement('div')
        synSection.className = 'd-section'
        synSection.innerHTML = '<div class="d-label">synonyms</div>'
        const synChips = document.createElement('div')
        synChips.className = 'd-chips'
        if (data.synonyms.length) {
          data.synonyms.forEach(s => {
            const chip = document.createElement('div')
            chip.className = 'd-chip' + (s.rhymes ? ' rhymes' : '')
            chip.textContent = s.word
            chip.onclick = () => insertWordToEditor(s.word)
            synChips.appendChild(chip)
          })
        } else {
          synChips.innerHTML = '<span class="d-empty">none found</span>'
        }
        synSection.appendChild(synChips)
        scroll.appendChild(synSection)

      } else if (drawerSource === 'songs') {
        // rhymes first
        const rhymeSection = document.createElement('div')
        rhymeSection.className = 'd-section'
        rhymeSection.innerHTML = '<div class="d-label">rhymes</div>'
        const chips = document.createElement('div')
        chips.className = 'd-chips'
        data.rhymes.perfect.forEach(w => {
          const chip = document.createElement('div')
          chip.className = 'd-chip perfect'
          chip.textContent = w
          chip.onclick = () => insertWordToEditor(w)
          chips.appendChild(chip)
        })
        rhymeSection.appendChild(chips)
        scroll.appendChild(rhymeSection)

        // songs categories
        data.songs.forEach(group => {
          const section = document.createElement('div')
          section.className = 'd-section'
          section.innerHTML = `<div class="d-label">${group.label}</div>`
          const synChips = document.createElement('div')
          synChips.className = 'd-chips'
          group.synonyms.forEach(s => {
            const chip = document.createElement('div')
            chip.className = 'd-chip' + (s.rhymes ? ' rhymes' : '')
            chip.textContent = s.word
            chip.onclick = () => insertWordToEditor(s.word)
            synChips.appendChild(chip)
          })
          section.appendChild(synChips)

          if (group.expand.length) {
            const expandLabel = document.createElement('div')
            expandLabel.className = 'd-group-label'
            expandLabel.style.marginTop = '4px'
            expandLabel.textContent = 'expand'
            section.appendChild(expandLabel)
            const expandChips = document.createElement('div')
            expandChips.className = 'd-chips'
            group.expand.forEach(w => {
              const chip = document.createElement('div')
              chip.className = 'd-chip'
              chip.textContent = w
              chip.onclick = () => insertWordToEditor(w)
              expandChips.appendChild(chip)
            })
            section.appendChild(expandChips)
          }

          scroll.appendChild(section)
        })

      } else if (drawerSource === 'scripture') {
        const rhymeSection = document.createElement('div')
        rhymeSection.className = 'd-section'
        rhymeSection.innerHTML = '<div class="d-label">rhymes</div>'
        const chips = document.createElement('div')
        chips.className = 'd-chips'
        data.rhymes.perfect.forEach(w => {
          const chip = document.createElement('div')
          chip.className = 'd-chip perfect'
          chip.textContent = w
          chip.onclick = () => insertWordToEditor(w)
          chips.appendChild(chip)
        })
        rhymeSection.appendChild(chips)
        scroll.appendChild(rhymeSection)

        const scriptSection = document.createElement('div')
        scriptSection.className = 'd-section'
        if (!data.scripture.length) {
          scriptSection.innerHTML = `<div class="d-label">scripture</div><div class="d-empty">"${data.word}" not found</div>`
        } else {
          scriptSection.innerHTML = `<div class="d-label">scripture — ${data.scripture.length} results</div>`
          data.scripture.forEach(v => {
            const verse = document.createElement('div')
            verse.className = 'd-verse'
            const highlighted = v.text.replace(
              new RegExp(data.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
              m => `<mark>${m}</mark>`
            )
            verse.innerHTML = `<div class="d-verse-ref">${v.ref}</div><div class="d-verse-text">${highlighted}</div>`
            verse.onclick = () => insertWordToEditor(v.ref)
            scriptSection.appendChild(verse)
          })
        }
        scroll.appendChild(scriptSection)
      }
    }

    function insertWordToEditor(word) {
      const editor = document.getElementById('editor')
      const s = editor.selectionStart, e = editor.selectionEnd
      editor.value = editor.value.slice(0,s) + word + editor.value.slice(e)
      editor.selectionStart = editor.selectionEnd = s + word.length
      editor.focus(); autoSave()
    }

    ipcRenderer.on('init-lockin', (event, { mode, content, title, filepath }) => {
      currentMode = mode
      currentFilepath = filepath
      document.getElementById('doc-title').textContent = title || 'untitled'
      document.getElementById('editor').value = content || ''
      document.getElementById('editor').focus()
      updateWordCount()
      updateOutline()
      if (mode === 'longform' && !content) showTemplatePicker()
    })

    // ── FORMATTING ──
    function fmtToggle(marker) {
      const area = document.getElementById('editor')
      const s = area.selectionStart, e = area.selectionEnd

      if (s !== e) {
        const selected = area.value.slice(s, e)
        const replacement = marker + selected + marker
        area.value = area.value.slice(0,s) + replacement + area.value.slice(e)
        area.selectionStart = s + marker.length
        area.selectionEnd = s + marker.length + selected.length
        area.focus(); autoSave(); return
      }

      if (fmtModes[marker]) {
        const pos = area.selectionStart
        area.value = area.value.slice(0, pos) + marker + area.value.slice(pos)
        area.selectionStart = area.selectionEnd = pos + marker.length
        fmtModes[marker] = false
      } else {
        const pos = area.selectionStart
        area.value = area.value.slice(0, pos) + marker + area.value.slice(pos)
        area.selectionStart = area.selectionEnd = pos + marker.length
        fmtModes[marker] = true
      }
      area.focus(); autoSave()
    }

    function fmtQuote() {
      const area = document.getElementById('editor')
      const pos = area.selectionStart
      const text = area.value
      const lineStart = text.lastIndexOf('\n', pos-1) + 1
      const lineEnd = text.indexOf('\n', pos)
      const end = lineEnd === -1 ? text.length : lineEnd
      const line = text.slice(lineStart, end)
      const newLine = line.startsWith('> ') ? line.slice(2) : '> ' + line
      area.value = text.slice(0, lineStart) + newLine + text.slice(end)
      area.selectionStart = area.selectionEnd = lineStart + newLine.length
      area.focus(); autoSave()
    }

    function fmtBullet() {
      const area = document.getElementById('editor')
      const pos = area.selectionStart
      const text = area.value
      const lineStart = text.lastIndexOf('\n', pos-1) + 1
      const lineEnd = text.indexOf('\n', pos)
      const end = lineEnd === -1 ? text.length : lineEnd
      const line = text.slice(lineStart, end)
      const newLine = '• ' + line.replace(/^[•\-]\s*/,'')
      area.value = text.slice(0, lineStart) + newLine + text.slice(end)
      area.selectionStart = area.selectionEnd = lineStart + newLine.length
      area.focus(); autoSave()
    }

    function fmtSection() {
      const area = document.getElementById('editor')
      const pos = area.selectionStart
      const insert = '\n---\n'
      area.value = area.value.slice(0, pos) + insert + area.value.slice(pos)
      area.selectionStart = area.selectionEnd = pos + insert.length
      area.focus(); autoSave()
    }

    // ── TEMPLATES ──
    const TEMPLATES = {
      blank:  { title: '', content: '' },
      sermon: {
        title: 'New Sermon',
        content: '# Series\n\n\n# Scripture\n\n\n# Big Idea\nOne sentence that captures everything.\n\n\n# Point 1\n\n\n# Point 2\n\n\n# Point 3\n\n\n# Illustration\n\n\n# Application\n\n\n# Call to Action'
      },
      essay: {
        title: 'New Essay',
        content: '# Introduction\n\n\n# Main Argument\n\n\n# Supporting Point 1\n\n\n# Supporting Point 2\n\n\n# Supporting Point 3\n\n\n# Conclusion'
      },
      study: {
        title: 'New Bible Study',
        content: '# Passage\n\n\n# Observation\nWhat does it say?\n\n\n# Interpretation\nWhat does it mean?\n\n\n# Application\nWhat do I do with it?\n\n\n# Prayer'
      }
    }

    function showTemplatePicker() {
      const picker = document.getElementById('template-picker')
      const options = document.getElementById('template-options')
      options.innerHTML = ''
      picker.style.display = 'flex'

      const labels = { blank: 'blank', sermon: 'sermon', essay: 'essay', study: 'bible study' }
      const descs  = { blank: 'empty — start fresh', sermon: 'scripture · points · application', essay: 'intro · argument · conclusion', study: 'observe · interpret · apply · pray' }

      Object.keys(TEMPLATES).forEach(key => {
        const btn = document.createElement('button')
        btn.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:11px;padding:10px 14px;border-radius:6px;border:0.5px solid rgba(255,255,255,0.13);color:#9a9080;background:#252528;cursor:pointer;text-align:left;transition:all 0.12s;outline:none;width:100%;'
        btn.onmouseenter = () => { btn.style.borderColor = '#a07420'; btn.style.color = '#f0e8d8' }
        btn.onmouseleave = () => { btn.style.borderColor = 'rgba(255,255,255,0.13)'; btn.style.color = '#9a9080' }
        btn.innerHTML = `<div style="font-weight:500;color:#f0e8d8;margin-bottom:3px;">${labels[key]}</div><div style="font-size:9px;color:#4e4a44">${descs[key]}</div>`
        btn.onclick = () => { picker.style.display = 'none'; applyTemplate(key) }
        options.appendChild(btn)
      })
    }

    function skipTemplate() {
      document.getElementById('template-picker').style.display = 'none'
      document.getElementById('editor').focus()
    }

    function showConfirm(message, onConfirm) {
      const popup = document.getElementById('confirm-popup')
      document.getElementById('confirm-message').textContent = message
      popup.style.display = 'flex'
      document.getElementById('confirm-cancel').onclick = () => { popup.style.display = 'none' }
      document.getElementById('confirm-ok').onclick = () => { popup.style.display = 'none'; onConfirm() }
    }

    function applyTemplate(key) {
      const tmpl = TEMPLATES[key]
      if (!tmpl) return
      const editor = document.getElementById('editor')

      if (key === 'blank') {
        if (editor.value.trim()) {
          showConfirm('Clear all content? This cannot be undone.', () => {
            editor.value = ''
            autoSave(); updateWordCount()
            if (outlineVisible) updateOutline()
          })
          return
        }
        editor.value = ''
      } else if (tmpl.content) {
        if (editor.value.trim()) {
          showConfirm('Replace current content with this template?', () => {
            editor.value = tmpl.content
            autoSave(); updateWordCount()
            if (outlineVisible) updateOutline()
          })
          return
        }
        editor.value = tmpl.content
      }

      autoSave(); updateWordCount()
      if (outlineVisible) updateOutline()

      document.querySelectorAll('#template-switcher .room-dot').forEach(d => d.classList.remove('active'))
      const dot = document.getElementById('dot-' + key)
      if (dot) dot.classList.add('active')

      editor.focus()
    }

    // ── WIDTH ──
    function setWidth(size) {
      const widths = { narrow: '520px', medium: '660px', wide: '860px' }
      const w = widths[size]
      document.getElementById('editor').style.maxWidth = w
      document.getElementById('doc-title').style.maxWidth = w
      ;['w-narrow','w-medium','w-wide'].forEach(id => {
        document.getElementById(id).classList.remove('active')
      })
      document.getElementById('w-' + size).classList.add('active')
    }

    // ── ROOM ──
    function setRoom(room) {
      currentRoom = room
      document.body.className = 'room-' + room
      document.querySelectorAll('.room-dot').forEach(d => d.classList.remove('active'))
      document.getElementById('dot-' + room).classList.add('active')
      const flash = document.getElementById('room-flash')
      flash.textContent = room
      flash.style.opacity = '1'
      setTimeout(() => { flash.style.opacity = '0' }, 1200)
    }

    // ── OUTLINE ──
    function toggleOutline() {
      outlineVisible = !outlineVisible
      document.getElementById('outline-sidebar').classList.toggle('visible', outlineVisible)
      document.getElementById('outline-btn').classList.toggle('active', outlineVisible)
      if (outlineVisible) updateOutline()
    }

    function updateOutline() {
      if (!outlineVisible) return
      const text = document.getElementById('editor').value
      const lines = text.split('\n')
      const container = document.getElementById('outline-items')
      container.innerHTML = ''
      const SECTION_MARKERS = ['verse','chorus','bridge','pre-chorus','tag','intro','outro','hook','section','part','chapter','scene','point','application','scripture','illustration']
      let hasItems = false

      lines.forEach((line, i) => {
        const trimmed = line.trim().toLowerCase()
        if (!trimmed) return

        if (line.startsWith('# ') || line.startsWith('## ')) {
          const item = document.createElement('div')
          item.className = 'outline-item section'
          item.textContent = line.replace(/^#+\s/,'').trim()
          item.onclick = () => jumpToLine(i)
          container.appendChild(item)
          hasItems = true
          return
        }

        if (/^-{3,}$/.test(trimmed)) {
          const div = document.createElement('div')
          div.className = 'outline-divider'
          container.appendChild(div)
          return
        }

        const colonMatch = line.trim().match(/^([A-Za-z\s\-]+):\s*$/)
        if (colonMatch) {
          const label = colonMatch[1].trim().toLowerCase()
          if (SECTION_MARKERS.some(m => label.includes(m)) || line.trim().length < 20) {
            const item = document.createElement('div')
            item.className = 'outline-item section'
            item.textContent = colonMatch[1].trim()
            item.onclick = () => jumpToLine(i)
            container.appendChild(item)
            hasItems = true
            return
          }
        }

        const words = trimmed.split(/\s+/)
        if (words.length <= 3 && trimmed.length > 2 && !trimmed.includes(',')) {
          const item = document.createElement('div')
          item.className = 'outline-item sub'
          item.textContent = line.trim()
          item.onclick = () => jumpToLine(i)
          container.appendChild(item)
          hasItems = true
        }
      })

      if (!hasItems) {
        const empty = document.createElement('div')
        empty.style.cssText = 'font-size:10px;color:var(--text3);font-style:italic;font-family:JetBrains Mono,monospace;'
        empty.textContent = 'write more to generate outline'
        container.appendChild(empty)
      }
    }

    function jumpToLine(lineIndex) {
      const editor = document.getElementById('editor')
      const lines = editor.value.split('\n')
      let pos = 0
      for (let i = 0; i < lineIndex; i++) pos += lines[i].length + 1
      editor.focus()
      editor.setSelectionRange(pos, pos)
      const lineHeight = parseFloat(getComputedStyle(editor).lineHeight)
      editor.scrollTop = lineIndex * lineHeight - 200
    }

    // ── WORD COUNT ──
    function updateWordCount() {
      const text = document.getElementById('editor').value
      const words = text.trim() ? text.trim().split(/\s+/).length : 0
      const lines = text.split('\n').length
      document.getElementById('word-count').textContent = `${words} words · ${lines} lines`
    }

    // ── AUTOSAVE ──
    function autoSave() {
      clearTimeout(saveTimer)
      saveTimer = setTimeout(() => {
        if (!currentFilepath) return
        try {
          const raw = fs.readFileSync(currentFilepath, 'utf8')
          const content = document.getElementById('editor').value
          let updated

          if (currentMode === 'write' || currentMode === 'longform') {
            updated = raw.replace(/(## idea\n)([\s\S]*?)(\n## |\n# |$)/,
              (match, before, old, after) => before + content + '\n' + after)
            if (!updated.includes(content))
              updated = raw.replace(/(## idea\n)([\s\S]*)/, '$1' + content + '\n')
          } else {
            updated = raw.replace(/(## admin\n)([\s\S]*?)(\n## |\n# |$)/,
              (match, before, old, after) => before + content + '\n' + after)
            if (!updated.includes(content))
              updated = raw.replace(/(## admin\n)([\s\S]*)/, '$1' + content + '\n')
          }

          ipcRenderer.send('lockin-save', { filepath: currentFilepath, content: updated })
        } catch(e) {}
      }, 800)
    }

    // ── EXIT ──
    function exitLockIn() {
      const content = document.getElementById('editor').value
      ipcRenderer.send('close-lockin', content)
    }

    // ── KEYBOARD ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') exitLockIn()
      if (e.key === 's' && e.metaKey) { e.preventDefault(); autoSave() }
      if (e.key === 'b' && e.metaKey) { e.preventDefault(); fmtToggle('**') }
      if (e.key === 'i' && e.metaKey) { e.preventDefault(); fmtToggle('_') }
    })

    document.getElementById('editor').addEventListener('input', () => {
      updateWordCount(); autoSave()
      if (outlineVisible) updateOutline()
    })
    document.getElementById('editor').addEventListener('mouseup', () => {
    setTimeout(() => {
      const sel = window.getSelection()?.toString().trim()
      if (sel && sel.length > 1 && !sel.includes(' ') && drawerOpen) {
        ipcRenderer.send('lockin-drawer-lookup', sel)
      }
    }, 50)
  })
  </script>
</body>
