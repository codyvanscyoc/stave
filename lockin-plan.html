<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lock In — Plan</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1c1c1e;
      --bg2:      #252528;
      --bg3:      #2e2e32;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.13);
      --text:     #f0e8d8;
      --text2:    #9a9080;
      --text3:    #4e4a44;
      --accent:   #c8922a;
      --accent2:  #a07420;
      --accentbg: rgba(200,146,42,0.10);
      --success:  #4caf7d;
      --danger:   #c0392b;
    }

    html, body {
      width: 100%; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── TOP BAR ── */
    #top-bar {
      height: 46px; display: flex; align-items: center; gap: 12px;
      padding: 0 20px; background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      -webkit-app-region: drag; flex-shrink: 0; z-index: 100;
    }

    #stave-mark {
      font-size: 12px; font-weight: 500; color: var(--accent);
      opacity: 0.35; letter-spacing: 0.1em; -webkit-app-region: no-drag;
    }

    #project-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 500;
      color: var(--text); background: transparent;
      border: none; outline: none; flex: 1;
      -webkit-user-select: text; user-select: text;
      -webkit-app-region: no-drag;
    }

    #project-name::placeholder { color: var(--text3); }

    #exit-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 12px; border-radius: 5px;
      border: 0.5px solid var(--text3); color: var(--text3);
      background: transparent; cursor: pointer;
      transition: all 0.15s; -webkit-app-region: no-drag; outline: none;
    }

    #exit-btn:hover { color: var(--text); border-color: var(--text2); }

    /* ── MAIN LAYOUT ── */
    #main {
      display: flex; flex: 1; min-height: 0; padding-bottom: 48px;
    }

    .panel-label {
      font-size: 9px; font-weight: 500; letter-spacing: 0.14em;
      color: var(--text3); text-transform: uppercase;
    }

    /* ── LEFT — BRAIN DUMP ── */
    #braindump-panel {
    flex: 2; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 0.5px solid var(--border);
    }

    #braindump-header {
      padding: 12px 16px 8px; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }

    #plan-context {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      font-weight: 300; color: var(--text3); background: transparent;
      border: none; outline: none; flex: 1;
      -webkit-user-select: text; user-select: text;
    }

    #plan-context::placeholder { color: var(--text3); }

    #braindump-area {
      flex: 1; font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 300; line-height: 1.9;
      color: var(--text); background: transparent;
      border: none; outline: none; resize: none;
      padding: 12px 16px; -webkit-user-select: text; user-select: text;
    }

    #braindump-area::placeholder { color: var(--text3); font-style: italic; }

    #braindump-footer {
      padding: 8px 16px; border-top: 0.5px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }

    #word-count { font-size: 10px; color: var(--text3); flex: 1; }

    /* ── CENTER — TASKS + TIMELINE + LINKS ── */
    #tasks-panel {
      flex: 1; display: flex; flex-direction: column;
      border-right: 0.5px solid var(--border); min-width: 0; overflow: hidden;
    }

    #tasks-header {
      padding: 12px 14px 8px; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    }

    #extracted-tasks {
      flex: 1; overflow-y: auto; padding: 0 14px 8px; min-height: 0;
    }

    .ext-task-row {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 6px 0; border-bottom: 0.5px solid var(--border);
    }

    .ext-task-row:last-child { border-bottom: none; }

    .ext-task-check {
      width: 12px; height: 12px; border-radius: 50%;
      border: 0.5px solid var(--text3); flex-shrink: 0; margin-top: 2px;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }

    .ext-task-check.done { background: var(--success); border-color: var(--success); }
    .ext-task-check.done::after {
      content: ''; display: block; width: 4px; height: 3px;
      border-left: 1.5px solid #1c1c1e; border-bottom: 1.5px solid #1c1c1e;
      transform: rotate(-45deg) translateY(-1px);
    }

    .ext-task-body { flex: 1; min-width: 0; }

    .ext-task-text {
      font-size: 11px; color: var(--text); line-height: 1.5;
      outline: none; -webkit-user-select: text; user-select: text;
      font-family: 'JetBrains Mono', monospace; font-weight: 300;
    }

    .ext-task-text.done { text-decoration: line-through; color: var(--text3); }

    .ext-task-actions {
      display: flex; gap: 4px; margin-top: 3px; align-items: center; flex-wrap: wrap;
    }

    .ext-task-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 9px;
      padding: 1px 5px; border-radius: 4px;
      border: 0.5px solid var(--border); color: var(--text3);
      background: transparent; cursor: pointer; outline: none; transition: all 0.12s;
    }

    .ext-task-btn:hover { color: var(--text2); border-color: var(--border2); }
    .ext-task-btn.send { color: var(--accent); border-color: var(--accent2); background: var(--accentbg); }
    .ext-task-btn.reminder-set { color: var(--accent); border-color: var(--accent2); }
    .ext-task-btn.del:hover { color: var(--danger); border-color: var(--danger); }

    .ext-task-reminder-info { font-size: 9px; color: var(--accent2); }

    /* ── TIMELINE ── */
    #timeline-section {
      border-top: 0.5px solid var(--border); flex-shrink: 0; padding: 10px 14px;
    }

    #timeline-section-label {
      font-size: 9px; font-weight: 500; letter-spacing: 0.14em;
      color: var(--text3); text-transform: uppercase; margin-bottom: 8px;
    }

    #timeline-rows { position: relative; }

    .timeline-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px; height: 26px;
    }

    .timeline-row-label {
      font-size: 9px; color: var(--text3); width: 70px;
      flex-shrink: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; text-align: right;
    }

    .timeline-row-track {
      flex: 1; height: 14px; background: var(--bg2);
      border-radius: 4px; position: relative; overflow: visible;
    }

    .timeline-row-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      border-radius: 4px;
    }

    .timeline-row-today {
      position: absolute; top: -3px; bottom: -3px; width: 1.5px;
      background: var(--accent); opacity: 0.9; border-radius: 1px;
    }

    .timeline-row-remaining {
      font-size: 9px; color: var(--text3); width: 40px; flex-shrink: 0;
    }

    /* ── LINKS ── */
    #links-section { border-top: 0.5px solid var(--border); flex-shrink: 0; }

    #links-section-header {
      padding: 8px 14px 6px;
      display: flex; align-items: center; justify-content: space-between;
    }

    #links-list { max-height: 80px; overflow-y: auto; padding: 0 14px 4px; }

    .link-row {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 0; border-bottom: 0.5px solid var(--border);
    }

    .link-row:last-child { border-bottom: none; }

    .link-label {
      flex: 1; font-size: 10px; color: var(--accent);
      cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .link-label:hover { text-decoration: underline; }

    .link-del {
      font-size: 11px; color: var(--text3); cursor: pointer;
      padding: 0 3px; transition: color 0.12s;
    }

    .link-del:hover { color: var(--danger); }

    #link-input-row { display: flex; gap: 6px; padding: 5px 14px 8px; }

    #link-input {
      flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 10px;
      font-weight: 300; color: var(--text2); background: transparent;
      border: none; border-bottom: 0.5px solid var(--border);
      outline: none; padding-bottom: 3px;
      -webkit-user-select: text; user-select: text;
    }

    #link-input::placeholder { color: var(--text3); }

    /* ── RIGHT — PHASES ── */
    #phases-panel {
    flex: 1; flex-shrink: 0;
    display: flex; flex-direction: column; overflow: hidden;
    border-left: 0.5px solid var(--border);
    }

    #phases-header {
      padding: 12px 14px 8px; border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    }

    #phases-list { flex: 1; overflow-y: auto; padding: 8px 0; }

    .phase-block {
      margin: 0 8px 8px; border-radius: 7px;
      border: 0.5px solid var(--border2); background: var(--bg2);
      overflow: hidden; transition: border-color 0.15s;
    }

    .phase-block.selected { border-color: var(--accent2); }
    .phase-color-bar { height: 3px; width: 100%; }

    .phase-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; cursor: pointer;
      border-bottom: 0.5px solid var(--border);
    }

    .phase-name {
      flex: 1; font-size: 12px; font-weight: 500; color: var(--text);
      outline: none; background: transparent; border: none;
      -webkit-user-select: text; user-select: text;
      font-family: 'JetBrains Mono', monospace;
    }

    .phase-name::placeholder { color: var(--text3); font-weight: 300; }

    .phase-deadline {
      font-size: 9px; color: var(--text3); cursor: pointer;
      padding: 2px 6px; border-radius: 4px;
      border: 0.5px solid var(--border); transition: all 0.15s; white-space: nowrap;
    }

    .phase-deadline:hover { color: var(--accent); border-color: var(--accent2); }
    .phase-deadline.set { color: var(--accent); border-color: var(--accent2); }

    .phase-controls { display: flex; gap: 3px; }

    .phase-ctrl {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 1px 5px; border-radius: 3px;
      border: 0.5px solid var(--border); color: var(--text3);
      background: transparent; cursor: pointer; outline: none; transition: all 0.12s;
    }

    .phase-ctrl:hover { color: var(--text2); }
    .phase-ctrl.del:hover { color: var(--danger); border-color: var(--danger); }

    .phase-tasks { padding: 6px 8px; }

    .phase-task-row {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 4px 0; border-bottom: 0.5px solid var(--border);
    }

    .phase-task-row:last-child { border-bottom: none; }

    .phase-task-check {
      width: 12px; height: 12px; border-radius: 50%;
      border: 0.5px solid var(--text3); flex-shrink: 0; margin-top: 2px;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }

    .phase-task-check.done { background: var(--success); border-color: var(--success); }
    .phase-task-check.done::after {
      content: ''; display: block; width: 4px; height: 3px;
      border-left: 1.5px solid #1c1c1e; border-bottom: 1.5px solid #1c1c1e;
      transform: rotate(-45deg) translateY(-1px);
    }

    .phase-task-text {
      flex: 1; font-size: 11px; color: var(--text2); line-height: 1.5;
      outline: none; -webkit-user-select: text; user-select: text;
      font-family: 'JetBrains Mono', monospace; font-weight: 300;
    }

    .phase-task-text.done { text-decoration: line-through; color: var(--text3); }

    .phase-task-del {
      font-size: 11px; color: var(--text3); cursor: pointer;
      padding: 0 3px; flex-shrink: 0; transition: color 0.12s;
    }

    .phase-task-del:hover { color: var(--danger); }

    .phase-task-add { display: flex; gap: 6px; margin-top: 6px; }

    .phase-task-input {
      flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px;
      font-weight: 300; color: var(--text2); background: transparent;
      border: none; border-bottom: 0.5px solid var(--border);
      outline: none; padding-bottom: 3px;
      -webkit-user-select: text; user-select: text;
    }

    .phase-task-input::placeholder { color: var(--text3); }

    #add-phase-btn {
      margin: 4px 8px 12px; padding: 8px;
      border: 0.5px dashed var(--border2); border-radius: 7px;
      color: var(--text3); font-family: 'JetBrains Mono', monospace;
      font-size: 10px; background: transparent; cursor: pointer;
      text-align: center; transition: all 0.15s; outline: none; flex-shrink: 0;
    }

    #add-phase-btn:hover { color: var(--text2); border-color: var(--border2); }

    /* ── TABS BAR (plan notes) ── */
   

    .plan-tab-dot {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; cursor: pointer; flex-shrink: 0;
    }

    .plan-tab-dot-circle {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--teal, #4caf7d);
      transition: transform 0.15s, opacity 0.15s;
      opacity: 0.5; border: 1.5px solid transparent;
    }

    .plan-tab-dot:hover .plan-tab-dot-circle { opacity: 0.9; transform: scale(1.2); }
    .plan-tab-dot.active .plan-tab-dot-circle { opacity: 1; border-color: var(--text2); transform: scale(1.1); }

    .plan-tab-dot-label {
      font-size: 8px; color: var(--text3); max-width: 60px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .plan-tab-dot.active .plan-tab-dot-label { color: var(--accent); }

    /* ── BUTTONS ── */
    .btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 10px; border-radius: 5px;
      border: 0.5px solid var(--border2); color: var(--text2);
      background: transparent; cursor: pointer;
      letter-spacing: 0.04em; transition: all 0.15s; outline: none;
    }

    .btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--bg2); }
    .btn.accent { border-color: var(--accent2); color: var(--accent); background: var(--accentbg); }
    .btn.accent:hover { background: rgba(200,146,42,0.18); }

    .empty-tasks {
      font-size: 11px; color: var(--text3); font-style: italic;
      padding: 10px 0; text-align: center;
    }

    /* ── DATE POPUP ── */
    #date-popup {
      display: none; position: fixed;
      background: var(--bg3); border: 0.5px solid var(--border2);
      border-radius: 8px; padding: 12px; z-index: 300;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    #date-popup.open { display: block; }
    .date-popup-label { font-size: 10px; color: var(--text3); margin-bottom: 8px; }

    .date-popup-input {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: var(--bg2); border: 0.5px solid var(--border2);
      border-radius: 5px; padding: 5px 9px; color: var(--text);
      outline: none; width: 100%; margin-bottom: 8px;
    }

    .date-popup-footer { display: flex; gap: 6px; justify-content: flex-end; }

    /* ── REMINDER POPUP ── */
    #reminder-popup {
      display: none; position: fixed;
      background: var(--bg3); border: 0.5px solid var(--border2);
      border-radius: 8px; padding: 12px; z-index: 300;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4); min-width: 240px;
    }

    #reminder-popup.open { display: block; }
    .reminder-popup-label { font-size: 10px; color: var(--text2); margin-bottom: 8px; line-height: 1.4; }
    .reminder-popup-label strong { color: var(--text); }
    .reminder-popup-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
    .reminder-popup-lbl { font-size: 10px; color: var(--text3); width: 30px; flex-shrink: 0; }

    .reminder-popup-input {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      background: var(--bg2); border: 0.5px solid var(--border2);
      border-radius: 5px; padding: 4px 8px; color: var(--text); outline: none; flex: 1;
    }

    .reminder-popup-footer { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }

    /* ── CONFIRM POPUP ── */
    #confirm-popup {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 600;
      align-items: center; justify-content: center;
    }

    #confirm-popup.open { display: flex; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="stave-mark">S†</span>
    <input id="project-name" placeholder="note title..." spellcheck="false">
    <button id="exit-btn" onclick="exitLockInPlan()">exit lock in</button>
  </div>

  <div id="main">

    <!-- LEFT — BRAIN DUMP -->
    <div id="braindump-panel">
      <div id="braindump-header">
        <div class="panel-label">notes</div>
        <input id="plan-context" placeholder="meeting · location · date" spellcheck="false">
      </div>
      <textarea id="braindump-area"
        placeholder="dump everything here — ideas, questions, fragments..."></textarea>
      <div id="braindump-footer">
        <span id="word-count">0 words</span>
        <button class="btn accent" onclick="extractTasks()">extract tasks</button>
      </div>
    </div>

    <!-- CENTER — TASKS + TIMELINE + LINKS -->
    <div id="tasks-panel">
      <div id="tasks-header">
        <div class="panel-label">extracted tasks</div>
      </div>
      <div id="extracted-tasks">
        <div class="empty-tasks">extract tasks from notes</div>
      </div>

      <div id="timeline-section">
        <div id="timeline-section-label">timeline</div>
        <div id="timeline-rows">
          <div class="empty-tasks">set phase deadlines to see timeline</div>
        </div>
      </div>

      <div id="links-section">
        <div id="links-section-header">
          <span class="panel-label">links & refs</span>
          <button class="btn" onclick="openFolder()" style="font-size:9px;padding:2px 7px;">open folder</button>
        </div>
        <div id="links-list">
          <div class="empty-tasks">paste urls and references</div>
        </div>
        <div id="link-input-row">
          <input id="link-input" placeholder="paste url or note..." spellcheck="false">
          <button class="btn accent" onclick="addLink()">add</button>
        </div>
      </div>
    </div>

    <!-- RIGHT — PHASES -->
    <div id="phases-panel">
      <div id="phases-header">
        <div class="panel-label">phases</div>
      </div>
      <div id="phases-list"></div>
      <button id="add-phase-btn" onclick="addPhase()">+ add phase</button>
    </div>

  </div>

  

  <!-- DATE POPUP -->
  <div id="date-popup">
    <div class="date-popup-label" id="date-popup-label">deadline</div>
    <input class="date-popup-input" type="date" id="deadline-input">
    <div class="date-popup-footer">
      <button class="btn" onclick="closeDatePopup()">cancel</button>
      <button class="btn accent" onclick="confirmDeadline()">set</button>
    </div>
  </div>

  <!-- REMINDER POPUP -->
  <div id="reminder-popup">
    <div class="reminder-popup-label">reminder: <strong id="reminder-task-label"></strong></div>
    <div class="reminder-popup-row">
      <span class="reminder-popup-lbl">date</span>
      <input class="reminder-popup-input" type="date" id="reminder-date">
    </div>
    <div class="reminder-popup-row">
      <span class="reminder-popup-lbl">time</span>
      <input class="reminder-popup-input" type="time" id="reminder-time" step="1800">
    </div>
    <div class="reminder-popup-footer">
      <button class="btn" onclick="closeReminderPopup()">cancel</button>
      <button class="btn accent" onclick="confirmReminder()">set reminder</button>
    </div>
  </div>

  <!-- CONFIRM POPUP -->
  <div id="confirm-popup">
    <div style="background:var(--bg3);border:0.5px solid var(--border2);border-radius:10px;padding:24px;width:280px;">
      <div id="confirm-message" style="font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.6;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="confirm-cancel" style="font-family:JetBrains Mono,monospace;font-size:10px;padding:5px 14px;border-radius:5px;border:0.5px solid var(--accent2);color:var(--accent);background:var(--accentbg);cursor:pointer;outline:none;">cancel</button>
        <button id="confirm-ok" style="font-family:JetBrains Mono,monospace;font-size:10px;padding:5px 14px;border-radius:5px;border:0.5px solid var(--border2);color:var(--text3);background:transparent;cursor:pointer;outline:none;">delete</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')
    const fs = require('fs')
    const path = require('path')
    const os = require('os')

    const PHASE_COLORS = ['#c8922a','#4caf7d','#7f77dd','#d85a30','#378add','#d4537e','#e8b84b','#5bb8d4']

    // Stable id so a phase-copy of a task can be linked back to the original.
    function newTaskId() { return Math.random().toString(36).slice(2, 10) }

    // Toggle the `done` bit of any twin with the same id, on the other side
    // of the phase / top-level split. Keeps both views in sync.
    function syncTaskDoneById(id, newDone) {
      if (!id) return
      tasks.forEach(t => { if (t.id === id) t.done = newDone })
      phases.forEach(ph => (ph.tasks || []).forEach(pt => { if (pt.id === id) pt.done = newDone }))
    }

    // current note data
    let currentFilepath = null
    let currentTitle = ''
    let currentPlanContext = ''
    let tasks = []
    let phases = []
    let links = []

    // ── SAVE ──
    function handleBullet(e) {
      if (e.key === 'Tab') {
        e.preventDefault()
        const area = e.target, pos = area.selectionStart
        const text = area.value
        const lineStart = text.lastIndexOf('\n', pos - 1) + 1
        const lineEnd = text.indexOf('\n', pos)
        const end = lineEnd === -1 ? text.length : lineEnd
        const line = text.slice(lineStart, end)
        if (e.shiftKey) {
          if (line.startsWith('    ')) {
            area.value = text.slice(0, lineStart) + line.slice(4) + text.slice(end)
            area.selectionStart = area.selectionEnd = Math.max(lineStart, pos - 4)
          }
        } else {
          area.value = text.slice(0, lineStart) + '    ' + line + text.slice(end)
          area.selectionStart = area.selectionEnd = pos + 4
        }
        autoSave(); return
      }
      if (e.key === 'Enter') {
        const area = e.target, pos = area.selectionStart
        const text = area.value
        const lineStart = text.lastIndexOf('\n', pos - 1) + 1
        const line = text.slice(lineStart, pos)
        const bulletMatch = line.match(/^(\s*)(•)\s+/)
        if (bulletMatch) {
          e.preventDefault()
          if (line.trim() === '•') {
            area.value = text.slice(0, lineStart) + '\n' + text.slice(pos)
            area.selectionStart = area.selectionEnd = lineStart + 1
          } else {
            const insert = '\n' + bulletMatch[1] + '• '
            area.value = text.slice(0, pos) + insert + text.slice(pos)
            area.selectionStart = area.selectionEnd = pos + insert.length
          }
          autoSave(); return
        }
        const numMatch = line.match(/^(\s*)(\d+)\.\s+/)
        if (numMatch) {
          e.preventDefault()
          if (line.trim() === numMatch[2] + '.') {
            area.value = text.slice(0, lineStart) + '\n' + text.slice(pos)
            area.selectionStart = area.selectionEnd = lineStart + 1
          } else {
            const insert = '\n' + numMatch[1] + (parseInt(numMatch[2]) + 1) + '. '
            area.value = text.slice(0, pos) + insert + text.slice(pos)
            area.selectionStart = area.selectionEnd = pos + insert.length
          }
          autoSave(); return
        }
        const dashMatch = line.match(/^(\s*)-\s+/)
        if (dashMatch) {
          e.preventDefault()
          if (line.trim() === '-') {
            area.value = text.slice(0, lineStart) + '\n' + text.slice(pos)
            area.selectionStart = area.selectionEnd = lineStart + 1
          } else {
            const insert = '\n' + dashMatch[1] + '- '
            area.value = text.slice(0, pos) + insert + text.slice(pos)
            area.selectionStart = area.selectionEnd = pos + insert.length
          }
          autoSave(); return
        }
      }
      if (e.key === ' ') {
        const area = e.target, pos = area.selectionStart
        const text = area.value
        const lineStart = text.lastIndexOf('\n', pos - 1) + 1
        if (text.slice(lineStart, pos) === '-') {
          e.preventDefault()
          const bullet = '• '
          area.value = text.slice(0, lineStart) + bullet + text.slice(pos)
          area.selectionStart = area.selectionEnd = lineStart + bullet.length
          autoSave()
        }
      }
    }

    function autoSave() {
      clearTimeout(saveTimer)
      saveTimer = setTimeout(() => saveNow(), 800)
    }

    function saveNow() {
      if (!currentFilepath) return
      const data = collectData()
      const md = serializeNote(data)
      ipcRenderer.send('lockin-plan-save', { filepath: currentFilepath, content: md })
    }

    function serializeNote(data) {
      let md = `# ${data.title || 'untitled'}\ntype: plan\ncontext1: ${data.planContext || ''}\n\n## admin\n${data.admin || ''}\n\n## tasks\n`
      ;(data.tasks || []).forEach(t => {
        md += `- [${t.done ? 'x' : ' '}] ${t.text}\n`
        if (t.id)       md += `  id: ${t.id}\n`
        if (t.reminder) md += `  reminder: ${t.reminder}\n`
      })
      md += `\n## phases\n`
      ;(data.phases || []).forEach(phase => {
        md += `### ${phase.name}\n`
        if (phase.color)    md += `color: ${phase.color}\n`
        if (phase.start)    md += `start: ${phase.start}\n`
        if (phase.deadline) md += `deadline: ${phase.deadline}\n`
        if (phase.done)     md += `status: done\n`
        ;(phase.tasks || []).forEach(t => {
          md += `- [${t.done ? 'x' : ' '}] ${t.text}\n`
          if (t.id) md += `  id: ${t.id}\n`
        })
      })
      md += `\n## links\n`
      ;(data.links || []).forEach(l => { md += `- ${l}\n` })
      return md
    }

    function addPhase() {
      phases.push({ name: 'new phase', color: PHASE_COLORS[phases.length % PHASE_COLORS.length], start: null, deadline: null, tasks: [] })

    // ── DATE POPUP ──
    function openDatePopup(phaseIndex, btn, field) {
      currentPhaseForDeadline = phaseIndex
      currentDateField = field
      const val = field === 'start' ? phases[phaseIndex].start : phases[phaseIndex].deadline
      document.getElementById('deadline-input').value = val || new Date().toISOString().slice(0,10)
      document.getElementById('date-popup-label').textContent = field === 'start' ? 'phase start' : 'phase deadline'
      const rect = btn.getBoundingClientRect()
      const popup = document.getElementById('date-popup')
      popup.style.top = (rect.bottom + 6) + 'px'
      popup.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px'
      popup.classList.add('open')
    }

    function closeDatePopup() {
      document.getElementById('date-popup').classList.remove('open')
      currentPhaseForDeadline = null
    }

    function confirmDeadline() {
      const date = document.getElementById('deadline-input').value
      if (!date || currentPhaseForDeadline === null) { closeDatePopup(); return }
      if (currentDateField === 'start') phases[currentPhaseForDeadline].start = date
      else phases[currentPhaseForDeadline].deadline = date
      autoSave(); renderPhases(); renderTimeline()
      closeDatePopup()
    }

    function formatDeadline(dateStr) {
      const d = new Date(dateStr + 'T12:00:00')
      const now = new Date()
      const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24))
      if (diff < 0) return `${Math.abs(diff)}d ago`
      if (diff === 0) return 'today'
      if (diff <= 30) return `${diff}d`
      if (diff <= 90) return `${Math.ceil(diff/7)}w`
      return `${Math.ceil(diff/30)}mo`
    }

    // ── TIMELINE ──
    function renderTimeline() {
      const container = document.getElementById('timeline-rows')
      container.innerHTML = ''

      const phasesWithDeadlines = phases.filter(ph => ph.deadline)
      if (!phasesWithDeadlines.length) {
        container.innerHTML = '<div class="empty-tasks">set phase deadlines to see timeline</div>'
        return
      }

      const now = new Date()
      const allDates = phasesWithDeadlines.map(ph => new Date(ph.deadline + 'T12:00:00'))
      const allStarts = phasesWithDeadlines.map(ph => ph.start ? new Date(ph.start + 'T12:00:00') : now)
      const minDate = new Date(Math.min(...allStarts, now))
      const maxDate = new Date(Math.max(...allDates))
      minDate.setDate(minDate.getDate() - 1)
      maxDate.setDate(maxDate.getDate() + 2)
      const totalMs = maxDate - minDate
      const todayPct = Math.max(0, Math.min(100, ((now - minDate) / totalMs) * 100))

      phasesWithDeadlines.forEach((phase) => {
        const pi = phases.indexOf(phase)
        const color = PHASE_COLORS[pi % PHASE_COLORS.length]
        const deadline = new Date(phase.deadline + 'T12:00:00')
        const start = phase.start ? new Date(phase.start + 'T12:00:00') : minDate
        const isPast = deadline < now
        const diff = Math.ceil((deadline - now) / (1000 * 60 * 60 * 24))

        const startPct = Math.max(0, Math.min(95, ((start - minDate) / totalMs) * 100))
        const endPct = Math.max(0, Math.min(100, ((deadline - minDate) / totalMs) * 100))
        const widthPct = Math.max(2, endPct - startPct)

        const row = document.createElement('div')
        row.className = 'timeline-row'

        const label = document.createElement('div')
        label.className = 'timeline-row-label'
        label.textContent = phase.name; label.title = phase.name

        const track = document.createElement('div')
        track.className = 'timeline-row-track'

        const fill = document.createElement('div')
        fill.className = 'timeline-row-fill'
        fill.style.left = startPct + '%'
        fill.style.width = widthPct + '%'
        fill.style.background = color
        fill.style.opacity = isPast ? '0.3' : '0.8'

        const todayLine = document.createElement('div')
        todayLine.className = 'timeline-row-today'
        todayLine.style.left = todayPct + '%'

        track.appendChild(fill); track.appendChild(todayLine)

        const remaining = document.createElement('div')
        remaining.className = 'timeline-row-remaining'
        remaining.style.color = isPast ? 'var(--danger)' : diff <= 7 ? 'var(--accent)' : 'var(--text3)'
        if (isPast) remaining.textContent = `${Math.abs(diff)}d ago`
        else if (diff === 0) remaining.textContent = 'today'
        else if (diff <= 30) remaining.textContent = `${diff}d`
        else if (diff <= 90) remaining.textContent = `${Math.ceil(diff/7)}w`
        else remaining.textContent = `${Math.ceil(diff/30)}mo`

        row.appendChild(label); row.appendChild(track); row.appendChild(remaining)
        container.appendChild(row)
      })
    }

    // ── EXTRACT TASKS ──
    const ACTION_WORDS = [
      'need to','needs to','have to','has to','must','should',
      'call','text','email','send','write','finish','complete',
      'schedule','book','order','buy','get','pick up','drop off',
      'follow up','follow-up','reach out','contact','remind',
      'submit','review','edit','update','fix','check','confirm',
      'prepare','plan','arrange','organize','set up','demo',
      'record','print','deliver','return','pay','invoice',
      'add','promote','announce','post','share','upload','download',
      'research','draft','pitch','present','assign','delegate',
      'approve','request','respond','reply','forward','create',
      'build','design','launch','test','finalize','publish',
      'message','meet','film','caption','graphic','artwork','budget'
    ]

    function scoreSentence(s) {
  const lower = s.toLowerCase().trim()
  
  // bullet lines are always tasks
  if (s.trim().startsWith('•') || s.trim().startsWith('-')) return 10
  
  // >> flag is always a task
  if (s.trim().startsWith('>>')) return 10

  let score = 0

  // action word at START of sentence = high priority
  const firstWord = lower.split(' ')[0]
  const firstTwo = lower.split(' ').slice(0,2).join(' ')
  const imperatives = ['call','send','write','email','get','buy','fix','check','review',
    'schedule','book','contact','finish','complete','submit','update','order','record',
    'print','demo','prepare','add','promote','post','share','create','build','design',
    'launch','film','message','meet','finalize','draft','research','follow','invite',
    'confirm','deliver','print','edit','assign','coordinate','publish','request']
  
  if (imperatives.includes(firstWord)) score += 5
  if (['need to','have to','must','should','follow up','reach out'].includes(firstTwo)) score += 4

  return score
}

    function extractTasks() {
      const text = document.getElementById('braindump-area').value
      if (!text.trim()) return
      const existingTexts = [
        ...tasks.map(t => t.text.trim().toLowerCase()),
        ...phases.flatMap(ph => (ph.tasks || []).map(t => t.text.trim().toLowerCase()))
      ]
      let added = 0
      text.split(/(?<=[.!?\n])/).map(s => s.trim()).filter(s => s.length > 4)
        .map(s => ({ text: s.replace(/^>>\s*/,'').trim(), score: scoreSentence(s) }))
        .filter(s => s.score >= 4 && s.text.length > 0 && !existingTexts.includes(s.text.trim().toLowerCase()))
        .forEach(c => { tasks.push({ id: newTaskId(), text: c.text, done: false, reminder: null }); added++ })
      if (added > 0) { autoSave(); renderExtractedTasks() }
    }

    // ── EXTRACTED TASKS ──
    function renderExtractedTasks() {
      const container = document.getElementById('extracted-tasks')
      container.innerHTML = ''

      if (!tasks.length) {
        container.innerHTML = '<div class="empty-tasks">extract tasks from notes</div>'
        return
      }

      tasks.forEach((task, i) => {
        const row = document.createElement('div')
        row.className = 'ext-task-row'
        if (task.reminder) row.dataset.reminder = task.reminder

        const check = document.createElement('div')
        check.className = 'ext-task-check' + (task.done ? ' done' : '')
        check.onclick = () => {
          const newDone = !tasks[i].done
          tasks[i].done = newDone
          // Mirror to any phase-copy with the same id
          if (tasks[i].id) {
            phases.forEach(ph => (ph.tasks || []).forEach(pt => {
              if (pt.id === tasks[i].id) pt.done = newDone
            }))
          }
          check.classList.toggle('done'); textEl.classList.toggle('done')
          autoSave(); renderPhases()
        }

        const body = document.createElement('div')
        body.className = 'ext-task-body'

        const textEl = document.createElement('div')
        textEl.className = 'ext-task-text' + (task.done ? ' done' : '')
        textEl.contentEditable = true
        textEl.textContent = task.text
        textEl.onblur = () => { tasks[i].text = textEl.textContent.trim(); autoSave() }

        const actions = document.createElement('div')
        actions.className = 'ext-task-actions'

        const sendBtn = document.createElement('button')
        sendBtn.className = 'ext-task-btn send'
        sendBtn.textContent = '→ phase'
        sendBtn.onclick = (e) => showPhasePicker(e, i)

        const reminderBtn = document.createElement('button')
        reminderBtn.className = 'ext-task-btn' + (task.reminder ? ' reminder-set' : '')
        reminderBtn.textContent = task.reminder ? 'edit reminder' : '+ reminder'
        reminderBtn.onclick = () => openReminderPopup(i, reminderBtn)

        const reminderInfo = document.createElement('span')
        reminderInfo.className = 'ext-task-reminder-info'
        if (task.reminder) {
          try {
            const d = new Date(task.reminder)
            if (!isNaN(d)) {
              reminderInfo.textContent = `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}/${d.getFullYear().toString().slice(2)} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`
            }
          } catch(e) {}
        }

        const delBtn = document.createElement('button')
        delBtn.className = 'ext-task-btn del'
        delBtn.textContent = '×'
        delBtn.onclick = () => { tasks.splice(i, 1); autoSave(); renderExtractedTasks() }

        actions.appendChild(sendBtn); actions.appendChild(reminderBtn)
        actions.appendChild(reminderInfo); actions.appendChild(delBtn)
        body.appendChild(textEl); body.appendChild(actions)
        row.appendChild(check); row.appendChild(body)
        container.appendChild(row)
      })
    }

    function showPhasePicker(e, taskIndex) {
      document.querySelectorAll('.phase-picker').forEach(el => el.remove())
      if (!phases.length) {
        phases.push({ name: 'inbox', start: null, deadline: null, tasks: [] })
        autoSave(); renderPhases()
      }

      const picker = document.createElement('div')
      picker.className = 'phase-picker'
      picker.style.cssText = 'position:fixed;background:var(--bg3);border:0.5px solid var(--border2);border-radius:6px;padding:4px 0;z-index:400;box-shadow:0 6px 20px rgba(0,0,0,0.4);min-width:140px;'

      const rect = e.target.getBoundingClientRect()
      picker.style.top = (rect.bottom + 4) + 'px'
      picker.style.left = rect.left + 'px'

      phases.forEach((phase, pi) => {
        const color = PHASE_COLORS[pi % PHASE_COLORS.length]
        const item = document.createElement('div')
        item.style.cssText = 'padding:6px 12px;font-size:11px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px;font-family:JetBrains Mono,monospace;'
        item.onmouseenter = () => item.style.background = 'var(--bg2)'
        item.onmouseleave = () => item.style.background = 'transparent'

        const dot = document.createElement('span')
        dot.style.cssText = `width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block;`
        item.appendChild(dot)
        item.appendChild(document.createTextNode(phase.name))
        item.onclick = () => {
          // Copy task to phase, keeping the original in tasks list. The phase
          // copy shares the source's id so toggling either one syncs both.
          const src = tasks[taskIndex]
          if (!src.id) src.id = newTaskId()
          phases[pi].tasks.push({ id: src.id, text: src.text, done: src.done })
          autoSave(); renderPhases()
          picker.remove()
          // flash phase
          const blocks = document.querySelectorAll('.phase-block')
          if (blocks[pi]) {
            blocks[pi].style.borderColor = 'var(--accent)'
            setTimeout(() => { blocks[pi].style.borderColor = '' }, 600)
          }
        }
        picker.appendChild(item)
      })

      document.body.appendChild(picker)
      setTimeout(() => {
        document.addEventListener('click', function closePicker(ev) {
          if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener('click', closePicker) }
        })
      }, 0)
    }

    // ── REMINDER POPUP ──
    function getNearest30() {
      const now = new Date()
      const d = new Date(now)
      d.setMinutes(now.getMinutes() < 30 ? 30 : 0, 0, 0)
      if (now.getMinutes() >= 30) d.setHours(d.getHours() + 1)
      return d.toTimeString().slice(0,5)
    }

    function openReminderPopup(taskIndex, btn) {
      currentReminderTaskIndex = taskIndex
      const task = tasks[taskIndex]
      document.getElementById('reminder-task-label').textContent =
        task.text.length > 30 ? task.text.slice(0,30) + '…' : task.text
      document.getElementById('reminder-date').value = new Date().toISOString().slice(0,10)

      if (task.reminder) {
        try {
          const d = new Date(task.reminder)
          if (!isNaN(d)) {
            document.getElementById('reminder-date').value = d.toISOString().slice(0,10)
            document.getElementById('reminder-time').value = d.toTimeString().slice(0,5)
          } else {
            document.getElementById('reminder-time').value = getNearest30()
          }
        } catch(e) { document.getElementById('reminder-time').value = getNearest30() }
      } else {
        document.getElementById('reminder-time').value = getNearest30()
      }

      const rect = btn.getBoundingClientRect()
      const popup = document.getElementById('reminder-popup')
      popup.style.top = (rect.bottom + 6) + 'px'
      popup.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px'
      popup.classList.add('open')
    }

    function closeReminderPopup() {
      document.getElementById('reminder-popup').classList.remove('open')
      currentReminderTaskIndex = null
    }

    function confirmReminder() {
      const date = document.getElementById('reminder-date').value
      const time = document.getElementById('reminder-time').value
      if (!date || !time || currentReminderTaskIndex === null) { closeReminderPopup(); return }
      const isoString = `${date}T${time}`
      tasks[currentReminderTaskIndex].reminder = isoString
      autoSave()
      ipcRenderer.send('schedule-reminder', { title: tasks[currentReminderTaskIndex].text, date, time })
      closeReminderPopup()
      renderExtractedTasks()
    }

    // ── LINKS ──
    function addLink() {
      const input = document.getElementById('link-input')
      const val = input.value.trim()
      if (!val) return
      links.push(val); input.value = ''
      autoSave(); renderLinks()
    }

    function renderLinks() {
      const container = document.getElementById('links-list')
      container.innerHTML = ''
      if (!links.length) {
        container.innerHTML = '<div class="empty-tasks">paste urls and references</div>'
        return
      }
      links.forEach((link, i) => {
        const row = document.createElement('div')
        row.className = 'link-row'
        const label = document.createElement('div')
        label.className = 'link-label'
        try { const url = new URL(link); label.textContent = url.hostname; label.title = link }
        catch(e) { label.textContent = link.slice(0,40); label.style.color = 'var(--text2)' }
        label.onclick = () => { if (link.startsWith('http')) require('electron').shell.openExternal(link) }
        const del = document.createElement('span')
        del.className = 'link-del'; del.textContent = '×'
        del.onclick = () => { links.splice(i, 1); autoSave(); renderLinks() }
        row.appendChild(label); row.appendChild(del)
        container.appendChild(row)
      })
    }

    function openFolder() {
      const dir = currentFilepath ? path.dirname(currentFilepath) : ''
      if (dir) require('electron').shell.openPath(dir)
    }

    // ── WORD COUNT ──
    function updateWordCount() {
      const text = document.getElementById('braindump-area').value
      const words = text.trim() ? text.trim().split(/\s+/).length : 0
      document.getElementById('word-count').textContent = `${words} words`
    }

    // ── CONFIRM ──
    function showConfirm(message, onConfirm) {
      const popup = document.getElementById('confirm-popup')
      document.getElementById('confirm-message').textContent = message
      popup.classList.add('open')
      document.getElementById('confirm-cancel').onclick = () => popup.classList.remove('open')
      document.getElementById('confirm-ok').onclick = () => { popup.classList.remove('open'); onConfirm() }
    }

    // ── KEYBOARD ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (document.getElementById('date-popup').classList.contains('open')) { closeDatePopup(); return }
        if (document.getElementById('reminder-popup').classList.contains('open')) { closeReminderPopup(); return }
        exitLockInPlan()
      }
      if (e.key === 's' && e.metaKey) { e.preventDefault(); saveNow() }
    })

    document.getElementById('braindump-area').addEventListener('keydown', handleBullet)
    document.getElementById('braindump-area').addEventListener('input', () => {
      updateWordCount(); autoSave()
    })

    document.getElementById('project-name').addEventListener('input', () => {
      currentTitle = document.getElementById('project-name').value
      autoSave()
    })

    document.getElementById('plan-context').addEventListener('input', autoSave)
    document.getElementById('link-input').addEventListener('keydown', e => { if (e.key === 'Enter') addLink() })

    document.addEventListener('click', e => {
      if (!e.target.closest('#date-popup') && !e.target.closest('.phase-deadline')) closeDatePopup()
      if (!e.target.closest('#reminder-popup') && !e.target.closest('.ext-task-btn')) closeReminderPopup()
    })
  </script>
</body>
</html>
